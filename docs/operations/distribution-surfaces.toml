# Every place UNITARES is published, listed, or described outside this repo.
#
# Why this file exists: by 2026-10-06 the project was on a Hermes catalog pin,
# two awesome lists, Glama, two plugin marketplaces, PyPI, GHCR, Hugging Face,
# Zenodo and four websites. Several had drift checks; nothing listed them all,
# so "where are we listed?" was answered by searching GitHub, and a listing PR
# opened in another repo was visible only on that repo.
#
# Checked by scripts/ci/distribution_surfaces.py:
#   --offline (every PR, via tests/test_distribution_surfaces.py): the file
#     parses, every local path exists, every `covered_by` check exists, and
#     every distribution manifest in this repo is registered here. A new
#     glama.json / server.json / smithery.yaml / plugin.json / llms.txt that
#     nobody registered fails CI.
#   online (weekly, .github/workflows/positioning-surfaces.yml): runs each
#     surface's probe against the live surface and prints one report.
#
# Adding a surface: add a [[surface]] in the same change that creates it (or
# that opens the PR to someone else's list). Pick the probe that reads the
# live thing; use `manual` only when nothing can be read without a key, and
# then record what you saw and when.
#
# Kinds:
#   upstream-pin      a file in someone else's repo pinning our commit/version
#   upstream-listing  a line in someone else's list (awesome lists)
#   hosted-listing    a page a third party renders from our repo (Glama)
#   marketplace       a plugin manifest a client installs from
#   package           a registry artifact (PyPI, GHCR)
#   repo-metadata     GitHub description/topics, not a file
#   site              a website or dataset card that describes UNITARES
#   citation          DOI / CITATION.cff
#
# Probes (see the script for exact semantics):
#   catalog-pin       upstream file's sha/version vs the source repo's latest
#                     tag, and vs the pin our contract test exercises
#   upstream-listing  upstream file mentions `needle`; else is `pr` still open
#   manifest-versions every version field across a repo's manifests agrees
#                     with each other and with the repo's latest tag
#   repo-description  prints each repo's description; enforces `must_contain`
#   http-ok           URL answers 200
#   manual            `last_verified` is within `max_age_days`
#   covered           an existing check owns this surface (`covered_by`)

schema = 1

# --------------------------------------------------------------------------
# Listings in other people's repos
# --------------------------------------------------------------------------

[[surface]]
id = "hermes-plugin-catalog"
kind = "upstream-pin"
title = "Nous Hermes Agent plugin catalog"
where = "https://github.com/NousResearch/hermes-agent/blob/main/plugin-catalog/unitares.yaml"
source = "cirwel/unitares-host-adapter (plugin.yaml, pyproject.toml)"
refresh = """Hand PR to NousResearch/hermes-agent bumping sha + version + description. \
In the same unitares change, move CATALOG_PIN and the copied payloads in \
tests/test_hermes_catalog_plugin_contract.py to the new commit."""
covered_by = ["tests/test_hermes_catalog_plugin_contract.py"]
probe = { type = "catalog-pin", repo = "NousResearch/hermes-agent", path = "plugin-catalog/unitares.yaml", source_repo = "cirwel/unitares-host-adapter", pin_file = "tests/test_hermes_catalog_plugin_contract.py", pin_pattern = 'CATALOG_PIN = "([0-9a-f]{40})"' }

[[surface]]
id = "awesome-mcp-servers"
kind = "upstream-listing"
title = "punkpeye/awesome-mcp-servers (Agreements & Coordination)"
where = "https://github.com/punkpeye/awesome-mcp-servers/pull/15822"
source = "one-line blurb + Glama badge, written by hand in the PR"
refresh = "Edit the line by PR to punkpeye/awesome-mcp-servers. The list feeds Glama's directory."
probe = { type = "upstream-listing", repo = "punkpeye/awesome-mcp-servers", path = "README.md", needle = "cirwel/unitares", pr = 15822 }

[[surface]]
id = "awesome-ai-agent-governance"
kind = "upstream-listing"
title = "systempromptio/awesome-ai-agent-governance (Open-Source Governance Toolkits)"
where = "https://github.com/systempromptio/awesome-ai-agent-governance/pull/116"
source = "one-line blurb written by hand in the PR"
refresh = "Edit the line by PR to systempromptio/awesome-ai-agent-governance."
probe = { type = "upstream-listing", repo = "systempromptio/awesome-ai-agent-governance", path = "README.md", needle = "cirwel/unitares", pr = 116 }

# --------------------------------------------------------------------------
# Hosted listings and marketplaces
# --------------------------------------------------------------------------

[[surface]]
id = "glama"
kind = "hosted-listing"
title = "Glama MCP directory"
where = "https://glama.ai/mcp/servers/cirwel/unitares"
source = "glama.json, Dockerfile.glama, docker/glama/; listing copy is edited on Glama"
paths = ["glama.json", "Dockerfile.glama", "docker/glama/build-spec.json", "docker/glama/environment-schema.json", "docs/deployment/glama.md"]
refresh = "Bundle: glama-bundle.yml checks it on every PR. Listing copy: the operator checklist in docs/deployment/glama.md."
covered_by = [".github/workflows/glama-bundle.yml", "scripts/ci/check_glama_bundle.py"]
# Glama's API needs a key, so the listing is read by eye. 2026-10-06: v3.2.0,
# 13 tools (the progressive first-party surface), Apache-2.0, DOI shown.
probe = { type = "manual", url = "https://glama.ai/mcp/servers/cirwel/unitares", last_verified = "2026-10-06", max_age_days = 45, observed = "v3.2.0, 13 tools, short description 'A self-hosted accountability server for AI agents, exposed as MCP tools'" }

[[surface]]
id = "governance-plugin-marketplaces"
kind = "marketplace"
title = "Claude Code + Codex plugin (unitares-governance)"
where = "https://github.com/cirwel/unitares-governance-plugin"
source = ".claude-plugin/{plugin,marketplace}.json, .codex-plugin/plugin.json, .agents/plugins/marketplace.json"
refresh = "Plugin release (version bump in every manifest + tag). Skills arrive by the plugin-skill-sync auto-PR."
covered_by = [".github/workflows/plugin-skill-sync.yml"]
probe = { type = "manifest-versions", repo = "cirwel/unitares-governance-plugin", files = [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ".codex-plugin/plugin.json"] }

[[surface]]
id = "hermes-agent-plugins-v1"
kind = "marketplace"
title = "Agent Plugins v1 package for Hermes (install from this repo's subdirectory)"
where = "https://github.com/cirwel/unitares/tree/master/integrations/hermes"
source = "integrations/hermes/"
paths = ["integrations/hermes/plugin.json", "integrations/hermes/mcp.json", "integrations/hermes/README.md"]
refresh = "Edit in this repo. Not the catalog entry: the catalog installs unitares-host-adapter."
covered_by = ["tests/test_hermes_plugin_package.py"]
probe = { type = "covered" }

