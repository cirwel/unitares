[[surface]]
id = "github-repo-unitares"
kind = "repo-metadata"
title = "cirwel/unitares description"
where = "https://github.com/cirwel/unitares"
source = "CANONICAL_TAGLINE in scripts/diagnostics/check_doc_drift.py"
refresh = "gh repo edit cirwel/unitares --description ..."
covered_by = ["scripts/diagnostics/check_repo_description.py"]
probe = { type = "repo-description", repos = ["cirwel/unitares"], must_contain_tagline = true }

[[surface]]
id = "github-repos-family"
kind = "repo-metadata"
title = "Descriptions of the public sibling repos"
where = "https://github.com/cirwel"
source = "set in the GitHub UI per repo"
refresh = "gh repo edit <repo> --description ..."
probe = { type = "repo-description", repos = ["cirwel/unitares-governance-plugin", "cirwel/unitares-host-adapter", "cirwel/unitares-discord-bridge", "cirwel/unitares-resident", "cirwel/anima-mcp", "cirwel/CIRWEL"] }

