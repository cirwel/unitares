<!-- Interactive incident walkthrough widget embedded into demo.html by
     scripts/dev/build_public_site.py from docs/public-site/demo.md and
     tests/accountability_journey/incident-v0.json.
     Uses the CIRWEL house register tokens from PAGE_TEMPLATE and degrades
     cleanly to the static narrative below when JavaScript is disabled. -->
<section class="demo-stage" id="demo-stage" aria-label="Interactive incident walkthrough">
  <div class="demo-bar">
    <div class="demo-bar-left">
      <span class="demo-counter" id="demo-counter">Step 1 of 5</span>
    </div>
    <div class="demo-controls">
      <button type="button" class="demo-btn" id="demo-prev" aria-label="Previous step">← Prev</button>
      <button type="button" class="demo-btn demo-btn-primary" id="demo-play">▶ Play</button>
      <button type="button" class="demo-btn" id="demo-next" aria-label="Next step">Next →</button>
    </div>
  </div>

  <ol class="demo-steps" id="demo-steps" aria-label="Incident steps"></ol>

  <div class="demo-grid">
    <div class="demo-panel">
      <div class="demo-panel-head">
        <span class="demo-panel-label">Step</span>
        <span class="demo-tag" id="demo-step-tag"></span>
      </div>
      <h3 class="demo-step-title" id="demo-step-title"></h3>
      <p class="demo-step-summary" id="demo-step-summary"></p>
      <blockquote class="demo-quote" id="demo-step-quote"></blockquote>
      <div class="demo-edge-line" id="demo-step-edge"></div>
    </div>

    <div class="demo-panel">
      <div class="demo-panel-head">
        <span class="demo-panel-label">Records</span>
        <div class="demo-arm-switch" role="group" aria-label="Record representation">
          <button type="button" class="demo-arm-btn active" data-arm="unitares" aria-pressed="true">UNITARES record</button>
          <button type="button" class="demo-arm-btn" data-arm="structured_handoff" aria-pressed="false">Git + handoff</button>
        </div>
      </div>
      <div id="demo-records" class="demo-records"></div>
    </div>
  </div>

  <div class="demo-recon" id="demo-recon" hidden>
    <div class="demo-panel-head">
      <span class="demo-panel-label">Reconstruction</span>
      <span class="demo-tag" id="demo-recon-count"></span>
    </div>
    <div class="demo-recon-grid" id="demo-recon-grid"></div>
  </div>

  <noscript>
    <p class="demo-noscript">JavaScript is disabled; the complete walkthrough follows below.</p>
  </noscript>
</section>

<style>
  .demo-stage{margin:24px 0 38px;border-top:2px solid rgb(var(--ink));border-bottom:1px solid rgb(var(--line));padding:18px 0 22px}
  .demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .demo-bar-left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .demo-panel-label,.demo-counter,.demo-tag{font:500 11.5px/1.3 ui-monospace,"JetBrains Mono",Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
  .demo-counter,.demo-panel-label{color:rgb(var(--dim))}
  .demo-controls{display:flex;gap:8px;flex-wrap:wrap}
  .demo-btn{appearance:none;background:transparent;color:rgb(var(--ink));border:1px solid rgb(var(--line));padding:7px 12px;font:500 12px/1 ui-monospace,"JetBrains Mono",Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .demo-btn:hover:not(:disabled){border-color:rgb(var(--acc));color:rgb(var(--acc))}
  .demo-btn:disabled{opacity:.4;cursor:default}
  .demo-btn-primary{background:rgb(var(--acc));border-color:rgb(var(--acc));color:rgb(var(--bg))}
  .demo-btn-primary:hover:not(:disabled){color:rgb(var(--bg));filter:brightness(1.08)}
  .demo-steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .demo-step-btn{width:100%;text-align:left;appearance:none;background:transparent;color:rgb(var(--dim));border:1px solid rgb(var(--line));padding:9px 10px;cursor:pointer;font:400 13px/1.3 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;gap:4px}
  .demo-step-btn .demo-step-n{font:600 11px/1 ui-monospace,"JetBrains Mono",Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--dim))}
  .demo-step-btn.active{border-color:rgb(var(--acc));border-top-width:2px;color:rgb(var(--ink))}
  .demo-step-btn.active .demo-step-n{color:rgb(var(--acc))}
  .demo-step-btn.done{color:rgb(var(--ink))}
  .demo-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;align-items:start}
  .demo-panel{border-top:1px solid rgb(var(--line));padding-top:12px}
  .demo-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .demo-tag{padding:3px 7px;border:1px solid rgb(var(--acc));color:rgb(var(--acc))}
  .demo-step-title{margin:4px 0 8px;font-size:21px;line-height:1.2}
  .demo-step-summary{margin:0 0 12px;font-size:15.5px;color:rgb(var(--dim))}
  .demo-quote{margin:10px 0 12px;border-left:2px solid rgb(var(--acc));padding:6px 14px;font-style:italic;color:rgb(var(--ink))}
  .demo-edge-line{font:400 12.5px/1.5 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--dim));border-top:1px dashed rgb(var(--line));padding-top:8px}
  .demo-edge-line strong{color:rgb(var(--acc));font-weight:600}
  .demo-arm-switch{display:inline-flex;border:1px solid rgb(var(--line))}
  .demo-arm-btn{appearance:none;background:transparent;border:0;color:rgb(var(--dim));padding:4px 9px;font:500 11px/1.2 ui-monospace,"JetBrains Mono",Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .demo-arm-btn.active{background:rgb(var(--acc));color:rgb(var(--bg))}
  .demo-records{display:flex;flex-direction:column;gap:8px}
  .demo-rec{border:1px solid rgb(var(--line));padding:9px 11px;font-size:14px}
  .demo-rec.is-new{border-color:rgb(var(--acc));border-left-width:3px}
  .demo-rec.is-superseded{border-style:dashed;opacity:.82}
  .demo-rec-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .demo-rec-id{font:600 12.5px/1.3 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--ink))}
  .demo-rec-status{font:500 10.5px/1 ui-monospace,"JetBrains Mono",Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--dim))}
  .demo-rec-body{color:rgb(var(--dim));font-size:13.5px;line-height:1.45}
  .demo-rec-edges{margin-top:5px;font:400 11.5px/1.4 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--acc))}
  .demo-rec-sup{margin-top:4px;font:400 11px/1.4 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--dim))}
  .demo-recon{margin-top:18px;border-top:1px solid rgb(var(--line));padding-top:14px}
  .demo-recon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .demo-q{border-top:1px solid rgb(var(--line));padding-top:7px;font-size:13.5px}
  .demo-q-label{font:500 11.5px/1.3 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--dim));text-transform:uppercase;letter-spacing:.06em}
  .demo-q-ans{margin-top:3px;color:rgb(var(--ink))}
  .demo-q-src{margin-top:2px;font:400 11.5px/1.3 ui-monospace,"JetBrains Mono",Menlo,monospace;color:rgb(var(--acc))}
  .demo-noscript{font-size:14px;color:rgb(var(--dim));font-style:italic;margin:8px 0 0}
  @media (max-width:740px){
    .demo-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
    .demo-grid,.demo-recon-grid{grid-template-columns:1fr}
  }
</style>

<script>
(function () {
  const DATA = __DEMO_DATA_JSON__;
  const STEPS = DATA.steps;
  const EDGES = DATA.oracle_edges;
  const QUESTIONS = DATA.questions;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function findEdge(rel) {
    return EDGES.find(function (e) { return e.relation === rel; });
  }

  let stepIdx = 0;
  let armName = "unitares";
  let timer = null;

  const elStage = document.getElementById("demo-stage");
  const elSteps = document.getElementById("demo-steps");
  const elCounter = document.getElementById("demo-counter");
  const elTag = document.getElementById("demo-step-tag");
  const elTitle = document.getElementById("demo-step-title");
  const elSummary = document.getElementById("demo-step-summary");
  const elQuote = document.getElementById("demo-step-quote");
  const elEdge = document.getElementById("demo-step-edge");
  const elRecords = document.getElementById("demo-records");
  const elRecon = document.getElementById("demo-recon");
  const elReconCount = document.getElementById("demo-recon-count");
  const elReconGrid = document.getElementById("demo-recon-grid");
  const btnPrev = document.getElementById("demo-prev");
  const btnNext = document.getElementById("demo-next");
  const btnPlay = document.getElementById("demo-play");

  function stopPlay() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
    btnPlay.textContent = "▶ Play";
  }

  // Create step buttons once so activating a step never destroys keyboard focus.
  const stepButtons = STEPS.map(function (item, idx) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "demo-step-btn";
    btn.dataset.step = String(idx);
    btn.innerHTML = '<span class="demo-step-n">0' + item.number + "</span>"
      + "<span>" + esc(item.short_label) + "</span>";
    btn.addEventListener("click", function () {
      stopPlay();
      stepIdx = idx;
      render();
    });
    li.appendChild(btn);
    elSteps.appendChild(li);
    return btn;
  });

  function render() {
    const s = STEPS[stepIdx];
    elCounter.textContent = "Step " + s.number + " of " + STEPS.length;
    elTag.textContent = "0" + s.number + " · " + s.short_label;
    elTitle.textContent = s.title;
    elSummary.textContent = s.summary;
    elQuote.textContent = "“" + s.quote + "”";

    const edgeLines = s.relations.map(function (rel) {
      const e = findEdge(rel);
      return esc(e.source) + " —<strong>" + esc(e.relation) + "</strong>→ " + esc(e.target);
    });
    elEdge.innerHTML = edgeLines.join("<br>");

    stepButtons.forEach(function (btn, idx) {
      const isActive = idx === stepIdx;
      btn.classList.toggle("active", isActive);
      btn.classList.toggle("done", idx < stepIdx);
      if (isActive) {
        btn.setAttribute("aria-current", "step");
      } else {
        btn.removeAttribute("aria-current");
      }
    });

    const arm = DATA.arms[armName];
    const visibleIds = s.visible_records[armName];
    const prevIds = stepIdx > 0 ? STEPS[stepIdx - 1].visible_records[armName] : [];
    const shown = arm.records.filter(function (r) { return visibleIds.indexOf(r.record_id) !== -1; });

    // Derive supersession strictly from visible `supersedes` edges in this arm.
    const supersededTargets = {};
    shown.forEach(function (r) {
      (r.edges || []).forEach(function (e) {
        if (e.relation === "supersedes") {
          supersededTargets[e.target] = e.source;
        }
      });
    });

    elRecords.innerHTML = shown.map(function (r) {
      const isNew = prevIds.indexOf(r.record_id) === -1;
      const authoredSup = (r.edges || []).find(function (e) {
        return e.relation === "authored" && Object.prototype.hasOwnProperty.call(supersededTargets, e.target);
      });
      const factLines = Object.keys(r.facts || {}).map(function (k) {
        return esc(k.replace(/_/g, " ")) + ": " + esc(r.facts[k]);
      }).join(" · ");
      const recEdges = (r.edges || []).map(function (e) {
        return esc(e.relation) + " → " + esc(e.target);
      }).join(" · ");
      const supLine = authoredSup
        ? '<div class="demo-rec-sup">target superseded by ' + esc(supersededTargets[authoredSup.target]) + "</div>"
        : "";
      return '<div class="demo-rec' + (isNew ? " is-new" : "") + (authoredSup ? " is-superseded" : "") + '">'
        + '<div class="demo-rec-top">'
        + '<span class="demo-rec-id">' + esc(r.record_id) + "</span>"
        + '<span class="demo-rec-status">' + esc(r.kind) + "</span>"
        + "</div>"
        + '<div class="demo-rec-body">' + factLines + "</div>"
        + (recEdges ? '<div class="demo-rec-edges">' + recEdges + "</div>" : "")
        + supLine
        + "</div>";
    }).join("");

    elRecon.hidden = !s.show_reconstruction;
    if (s.show_reconstruction) {
      const holders = {};
      arm.records.forEach(function (r) {
        Object.keys(r.facts || {}).forEach(function (k) {
          if (!holders[k]) holders[k] = r;
        });
      });
      const answered = QUESTIONS.filter(function (q) { return Boolean(holders[q.fact_key]); }).length;
      elReconCount.textContent = answered + "/" + QUESTIONS.length + " (" + arm.representation.replace(/_/g, " ") + ")";
      elReconGrid.innerHTML = QUESTIONS.map(function (q) {
        const rec = holders[q.fact_key];
        const label = q.question_id.replace(/_/g, " ") + "?";
        const ans = rec ? rec.facts[q.fact_key] : "—";
        const src = rec ? rec.record_id : "missing";
        return '<div class="demo-q">'
          + '<div class="demo-q-label">' + esc(label) + "</div>"
          + '<div class="demo-q-ans">' + esc(ans) + "</div>"
          + '<div class="demo-q-src">record: ' + esc(src) + "</div>"
          + "</div>";
      }).join("");
    }

    btnPrev.disabled = stepIdx === 0;
    btnNext.disabled = stepIdx === STEPS.length - 1;
  }

  document.querySelectorAll(".demo-arm-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      armName = btn.dataset.arm;
      document.querySelectorAll(".demo-arm-btn").forEach(function (b) {
        const isActive = b === btn;
        b.classList.toggle("active", isActive);
        b.setAttribute("aria-pressed", String(isActive));
      });
      render();
    });
  });

  btnPrev.addEventListener("click", function () { stopPlay(); if (stepIdx > 0) { stepIdx--; render(); } });
  btnNext.addEventListener("click", function () { stopPlay(); if (stepIdx < STEPS.length - 1) { stepIdx++; render(); } });
  btnPlay.addEventListener("click", function () {
    if (timer) { stopPlay(); return; }
    stepIdx = 0;
    render();
    btnPlay.textContent = "■ Stop";
    timer = setInterval(function () {
      if (stepIdx >= STEPS.length - 1) { stopPlay(); return; }
      stepIdx++;
      render();
    }, 1800);
  });

  elStage.addEventListener("keydown", function (e) {
    if (e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.target.isContentEditable)) return;
    if (e.key === "ArrowRight" && stepIdx < STEPS.length - 1) { e.preventDefault(); stopPlay(); stepIdx++; render(); }
    else if (e.key === "ArrowLeft" && stepIdx > 0) { e.preventDefault(); stopPlay(); stepIdx--; render(); }
  });

  render();
})();
</script>
