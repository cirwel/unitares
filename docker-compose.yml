# UNITARES Governance — Docker Compose
#
# One-command quickstart for local evaluation:
#
#   docker compose up
#
# Then point an MCP client at http://localhost:8767/mcp/ and call start_session().
#
# On a master checkout, or after changing source, add --build so every service
# is built from the tree you have (see the lease-plane service below).
#
# This brings up:
#   - postgres-age      Postgres 18 + Apache AGE + pgvector  (internal only)
#   - redis             De-facto primary session store + locks (internal only)
#   - lease-plane       Exclusive surface leases + handoffs   (port 8788)
#   - governance-mcp    UNITARES governance server            (port 8767)
#
# Published ports bind to 127.0.0.1 only. Postgres and Redis carry a default
# credential (postgres/postgres) and no auth at all, so they are NOT published
# to the host by default: on Docker Desktop (macOS/Windows), where the VM
# hides the container bridge network from the host, this is a real boundary
# against another local process or OS account. On a native Linux Docker host
# it is weaker than that phrasing implies — the bridge network is directly
# routable from the host's own network namespace, so another local account
# can still reach a container's bridge IP even unpublished (no firewall rule
# stops it by default); un-publishing there mainly removes discovery via a
# well-known port, not access. See docs/DEPLOYMENT_SECURITY.md for the full
# caveat. governance-mcp and lease-plane reach both over the internal Compose
# network regardless of any of this. For direct host access (psql, redis-cli,
# a GUI client) during local debugging, opt in with the admin overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.admin.yml up
#
# See docs/DEPLOYMENT_SECURITY.md for the rest of this deployment's hardening
# posture and known gaps. Override credentials via .env (copy .env.example to
# .env). For the Pi/Lumen embodiment side (anima-mcp on port 8766), see
# https://github.com/CIRWEL/anima-mcp — the governance server runs standalone
# without it.

services:
  postgres-age:
    build:
      context: db/postgres
      dockerfile: Dockerfile.age-vector
    container_name: unitares-postgres-age
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-governance}
    # No host port by default — default credentials, internal-network only.
    # See docker-compose.admin.yml to opt in for local debugging.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # PG18+ official images store data in a major-version subdir and require
      # the persistent mount at /var/lib/postgresql (not .../data, which the
      # entrypoint rejects). See docker-library/postgres#1259.
      - postgres-age-data:/var/lib/postgresql
      # Schema bootstrap: the official Postgres entrypoint runs this script
      # once for an empty data volume. The script owns ordering across base
      # schema files, migrations, partition setup, and AGE graph setup.
      - ./db/postgres/docker-initdb.sh:/docker-entrypoint-initdb.d/01-unitares-init.sh:ro
      - ./db/postgres:/docker-entrypoint-initdb.d/unitares:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-governance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Redis 8 accepts the existing Redis 7 RDB/AOF data on this named volume.
    # Before the first production rollout, follow the snapshot and restore-drill
    # procedure in docs/operations/cloud-deploy-runbook.md.
    image: redis:8-alpine
    container_name: unitares-redis
    # No host port by default — no auth at all, internal-network only. See
    # docker-compose.admin.yml to opt in for local debugging.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's docker-entrypoint.sh only drops from root to the `redis`
    # user (matching the ownership baked into its /data dir) when it has
    # CAP_SETUID + CAP_SETGID; without them, cap_drop: ALL makes it fall
    # through to running redis-server AS root against a non-root-owned
    # volume, which then fails to create appendonlydir (verified 2026-09-28).
    # Its own perm-fixup step (fix_perms_and_owner in docker-entrypoint.sh)
    # chowns a file to `redis` and then chmods it while still root — after
    # the chown, root no longer owns the file, so that chmod needs CAP_FOWNER
    # too, or it silently no-ops on a volume carrying stale ownership/modes
    # from a prior run (a fresh volume doesn't hit this: fix_data_dir_perms
    # only walks existing files).
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  lease-plane:
    # A release checkout pulls the lease-plane image published from that same
    # release tag, so a fresh install does not fetch Hex packages or compile
    # Elixir. `make version-bump` moves this tag with VERSION when a release is
    # prepared (scripts/ops/version_manager.py); do not edit it by hand. If the
    # tag cannot be pulled (a release that predates the image, a release not yet
    # published, or no registry access), Compose builds from the block below
    # instead. On a master checkout the tag names a release, not your source:
    # run `docker compose up --build` to build what you have checked out.
    image: ghcr.io/cirwel/unitares-lease-plane:v3.1.0
    pull_policy: missing
    build:
      context: .
      dockerfile: elixir/lease_plane/Dockerfile
    container_name: unitares-lease-plane
    ports:
      # The container listens on its private Compose network; publication stays
      # loopback-only. Override the host side if 8788 is already occupied.
      - "127.0.0.1:${LEASE_PLANE_HOST_PORT:-8788}:8788"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UNITARES_LEASE_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-age:5432/${POSTGRES_DB:-governance}
      UNITARES_LEASE_PLANE_HTTP_IP: 0.0.0.0
      UNITARES_LEASE_PLANE_HTTP_PORT: 8788
      # Development-only default for a loopback quickstart. Set a unique value
      # in .env before exposing the service beyond a local evaluation machine.
      LEASE_PLANE_BEARER_TOKEN: ${LEASE_PLANE_BEARER_TOKEN:-unitares-local-lease-plane}
      UNITARES_GOVERNANCE_URL: http://governance-mcp:8767
      # Enforce request-bound operator attestations only for the maintenance
      # surface exercised by the coordination demo. Expand this list only after
      # each producer for a kind has been migrated to carry identity proof.
      UNITARES_LEASE_IDENTITY_BINDING: ${UNITARES_LEASE_IDENTITY_BINDING:-enforce}
      UNITARES_LEASE_IDENTITY_PROOF_FORMAT: ${UNITARES_LEASE_IDENTITY_PROOF_FORMAT:-attestation}
      UNITARES_LEASE_IDENTITY_BOUND_SURFACE_KINDS: ${UNITARES_LEASE_IDENTITY_BOUND_SURFACE_KINDS:-maintenance}
      UNITARES_LEASE_ATTESTATION_AUDIENCE: ${UNITARES_LEASE_ATTESTATION_AUDIENCE:-unitares-local-lease-plane}
      UNITARES_LEASE_TRUSTED_ISSUERS: '${UNITARES_LEASE_TRUSTED_ISSUERS:-{"unitares-local":"http://governance-mcp:8767/v1/lease-holder/keys"}}'
      # Exact private-Compose exception; every other HTTP key URL is rejected.
      UNITARES_LEASE_TRUST_INSECURE_HTTP_URLS: http://governance-mcp:8767/v1/lease-holder/keys
      # Singular client credential used by the lease plane for governance REST
      # calls. On hosted deployments it must be one member of the plural
      # UNITARES_MCP_BEARER_TOKENS server allowlist below.
      UNITARES_MCP_BEARER_TOKEN: ${UNITARES_MCP_BEARER_TOKEN:-}
      UNITARES_HTTP_API_TOKEN: ${UNITARES_HTTP_API_TOKEN:-}
    depends_on:
      postgres-age:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -H "Authorization: Bearer $$LEASE_PLANE_BEARER_TOKEN" http://127.0.0.1:8788/v1/health -o /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  governance-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitares-governance-mcp
    ports:
      # Override via GOVERNANCE_HOST_PORT in .env if 8767 is busy on the host.
      - "127.0.0.1:${GOVERNANCE_HOST_PORT:-8767}:8767"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-age:5432/${POSTGRES_DB:-governance}
      DB_BACKEND: postgres
      DB_AGE_GRAPH: governance_graph
      UNITARES_TOOL_ADVERTISEMENT: ${UNITARES_TOOL_ADVERTISEMENT:-progressive}
      REDIS_URL: redis://redis:6379/0
      # PostgreSQL is the canonical KG store; AGE is an explicit graph-feature opt-in.
      UNITARES_KNOWLEDGE_BACKEND: postgres
      UNITARES_DIALECTIC_BACKEND: postgres
      # Coordination boundary used by governed clients and spawned workers.
      LEASE_PLANE_BASE_URL: http://lease-plane:8788
      UNITARES_LEASE_PLANE_URL: http://lease-plane:8788
      LEASE_PLANE_BEARER_TOKEN: ${LEASE_PLANE_BEARER_TOKEN:-unitares-local-lease-plane}
      # Operator wiring (#1791): set these in .env to enable the operator-gated
      # surfaces. Empty default = unchanged behavior (default-deny stays on).
      #   UNITARES_OPERATOR_TOKENS — csv allowlist for X-Unitares-Operator
      #     (required by /v1/harness/outcome, the external outcome-producer path)
      #   UNITARES_HTTP_API_TOKEN  — REST bearer for callers outside the
      #     trusted networks. Callers through the Docker bridge arrive from
      #     the gateway, a trusted address, so it does not gate them; for
      #     REST auth on every call set UNITARES_MCP_BEARER_TOKENS (strict)
      #     and UNITARES_MCP_BEARER_TOKEN to one of its members; every other
      #     REST client then needs a member too (this token is not accepted)
      #   UNITARES_MCP_BEARER_TOKENS — hosted /mcp + strict REST bearer allowlist
      #   UNITARES_MCP_ALLOWED_HOSTS — external Host values accepted by /mcp
      #   UNITARES_MCP_ALLOWED_ORIGINS — origins accepted by MCP transport
      #   UNITARES_HTTP_CORS_EXTRA_ORIGINS — browser MCP preflight origins
      #   UNITARES_DASHBOARD_RP_ID / _ORIGIN — hosted passkey relying party
      #   UNITARES_REST_STRICT     — defaults on with MCP bearers; never disable
      #     for a deployment exposed through a loopback tunnel
      #   UNITARES_BUILD_SHA       — self-reported build sha for /health
      #     (the image carries no .git, so git rev-parse cannot answer inside
      #     the container; e.g. UNITARES_BUILD_SHA=$(git rev-parse --short HEAD))
      UNITARES_OPERATOR_TOKENS: ${UNITARES_OPERATOR_TOKENS:-}
      UNITARES_HTTP_API_TOKEN: ${UNITARES_HTTP_API_TOKEN:-}
      UNITARES_MCP_BEARER_TOKENS: ${UNITARES_MCP_BEARER_TOKENS:-}
      # Singular client credential forwarded to orchestrated MCP reviewers.
      # It must be one member of the plural server allowlist above.
      UNITARES_MCP_BEARER_TOKEN: ${UNITARES_MCP_BEARER_TOKEN:-}
      UNITARES_MCP_ALLOWED_HOSTS: ${UNITARES_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      UNITARES_MCP_ALLOWED_ORIGINS: ${UNITARES_MCP_ALLOWED_ORIGINS:-http://localhost:8767,http://127.0.0.1:8767}
      UNITARES_HTTP_CORS_EXTRA_ORIGINS: ${UNITARES_HTTP_CORS_EXTRA_ORIGINS:-}
      UNITARES_DASHBOARD_RP_ID: ${UNITARES_DASHBOARD_RP_ID:-}
      UNITARES_DASHBOARD_ORIGIN: ${UNITARES_DASHBOARD_ORIGIN:-}
      UNITARES_REST_STRICT: ${UNITARES_REST_STRICT:-}
      # Networks beyond loopback and RFC1918 whose callers skip auth in local
      # posture (comma-separated CIDRs); e.g. a Tailscale tailnet is
      # 100.64.0.0/10. Nothing else is trusted by default. See .env.example.
      UNITARES_TRUSTED_NETWORKS: ${UNITARES_TRUSTED_NETWORKS:-}
      # Your own substrate runtime's source markers (comma-separated),
      # trusted beyond the built-in generic ones. See .env.example.
      UNITARES_TRUSTED_SUBSTRATE_MARKERS: ${UNITARES_TRUSTED_SUBSTRATE_MARKERS:-}
      # Opt-in route packs (src/http_routes/packs.py); empty mounts core routes
      # only. Dashboard extensions: set the variable AND mount that directory
      # into this container, or the extension route has nothing to serve.
      UNITARES_ROUTE_PACKS: ${UNITARES_ROUTE_PACKS:-}
      UNITARES_DASHBOARD_EXT_DIR: ${UNITARES_DASHBOARD_EXT_DIR:-}
      # Deployment metrics catalog (JSON path inside the container); empty
      # registers only the product metrics. See .env.example.
      UNITARES_METRICS_CATALOG_EXTRA: ${UNITARES_METRICS_CATALOG_EXTRA:-}
      # Development-only signing key so onboard() can issue the identity proof
      # exercised by the coordination demo. Override on shared/non-loopback hosts.
      UNITARES_CONTINUITY_TOKEN_SECRET: ${UNITARES_CONTINUITY_TOKEN_SECRET:-unitares-local-continuity-secret}
      # Known development-only Ed25519 seed + issuer for the loopback quickstart.
      # Replace the seed and choose a globally stable issuer on shared installs.
      UNITARES_LEASE_ATTESTATION_SIGNING_KEY: ${UNITARES_LEASE_ATTESTATION_SIGNING_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8}
      UNITARES_LEASE_ATTESTATION_ISSUER: ${UNITARES_LEASE_ATTESTATION_ISSUER:-unitares-local}
      UNITARES_LEASE_ATTESTATION_AUDIENCE: ${UNITARES_LEASE_ATTESTATION_AUDIENCE:-unitares-local-lease-plane}
      # SDK continuity-proof exchanges may use HTTP only for this exact
      # private-Compose hostname (loopback remains allowed automatically).
      UNITARES_LEASE_INSECURE_GOVERNANCE_HOSTS: governance-mcp
      UNITARES_BUILD_SHA: ${UNITARES_BUILD_SHA:-}
      # Model for consult and the in-process dialectic reviewer (see
      # .env.example, "Model for advice and dialectic reviews"). Empty default =
      # no model configured, unchanged behavior. UNITARES_MODEL_BASE_URL is any
      # OpenAI-compatible server, /v1 included (Ollama on the Docker host:
      # http://host.docker.internal:11434/v1), and UNITARES_MODEL_ID a model it
      # serves. A privacy='local' request goes only to an endpoint the server
      # classifies local; a Compose service name such as vllm is local only
      # when listed in UNITARES_MODEL_LOCAL_HOSTS. The older names below are
      # aliases until v3.3.0 and are read only when the new ones are empty.
      UNITARES_MODEL_BASE_URL: ${UNITARES_MODEL_BASE_URL:-}
      UNITARES_MODEL_ID: ${UNITARES_MODEL_ID:-}
      UNITARES_MODEL_LOCAL_HOSTS: ${UNITARES_MODEL_LOCAL_HOSTS:-}
      UNITARES_MODEL_PRIVACY: ${UNITARES_MODEL_PRIVACY:-}
      # The classifier also reads UNITARES_TRUSTED_NETWORKS (mapped above), so a
      # model on a tailnet peer (100.64.0.0/10) is local once that range is
      # listed there.
      UNITARES_OLLAMA_BASE: ${UNITARES_OLLAMA_BASE:-}
      UNITARES_OLLAMA_BASE_URL: ${UNITARES_OLLAMA_BASE_URL:-}
      UNITARES_LLM_MODEL: ${UNITARES_LLM_MODEL:-}
      # Optional: pick embedding backend. Default falls back to PG FTS if
      # sentence-transformers / model not available at runtime.
      # UNITARES_EMBEDDING_MODEL: bge-m3
      # UNITARES_ENABLE_HYBRID: "1"
    # Lets the container reach a model server on the Docker host by name.
    # Docker Desktop resolves it already; on Linux this line is what makes it
    # resolve (Ollama must then listen beyond 127.0.0.1; see .env.example).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - governance-data:/app/data
    depends_on:
      postgres-age:
        condition: service_healthy
      redis:
        condition: service_healthy
      lease-plane:
        condition: service_healthy
    healthcheck:
      # Readiness is intentionally public so strict hosted bearer auth cannot
      # make Compose report a healthy governance server as unhealthy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8767/health/ready -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-age-data:
  redis-data:
  governance-data:
