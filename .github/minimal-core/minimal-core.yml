# Server + Postgres only: Redis and the lease plane both off.
services:
  redis:
    profiles: ["off"]
  lease-plane:
    profiles: ["off"]
  governance-mcp:
    environment:
      REDIS_ENABLED: "0"
      LEASE_PLANE_BEARER_TOKEN: ""
    depends_on: !override
      postgres-age: {condition: service_healthy}
