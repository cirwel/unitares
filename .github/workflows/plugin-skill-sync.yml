name: Plugin Skill Sync

# unitares-governance-plugin/skills/ is a byte mirror of skills/ here. Nothing
# used to run the sync, and the plugin's CI only checks the mirror against its
# OWN manifest, so a stale mirror passed; on 2026-09-25/26 it fell behind twice
# and was caught only by comparing the two repos by hand.
#
# On every push to master that touches skills/, this runs
# scripts/dev/open-plugin-skill-sync-pr.sh: in sync -> nothing happens; behind
# -> the mirror is committed to ONE automation branch (auto/plugin-skill-sync)
# in the plugin repo and a PR is opened there, or the open one is updated. An
# operator's local deploy wrapper runs the same script, so the two can never
# open competing PRs, and the push is a compare-and-swap either way. It never
# merges; the plugin's Verified mirror delivery workflow verifies and lands it.
#
# Credentials come from the master-only plugin-sync environment. The App token
# is short-lived and scoped to the plugin repository, with only contents and
# pull-request writes. No PR code runs with the signing key or token.

on:
  push:
    branches: [master]
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

# One at a time; a queued run supersedes an older queued one. Each run syncs to
# the newest master, so nothing is lost by skipping the ones in between.
concurrency:
  group: plugin-skill-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'cirwel/unitares' && github.ref == 'refs/heads/master'
    environment: plugin-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out unitares
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Default credentials kept: GITHUB_TOKEN is read-only here
        # (permissions: contents: read), and the script's fetch of master
        # then also works on a private fork.
        #
        # Full history, not depth 1. When the mirror and canonical declare the
        # same verification date, sync-plugin-skills.sh's direction guard
        # decides from canonical's git history whether canonical has moved past
        # the mirror, and without history it refuses (exit 4, fail closed).
        # The first live run, 2026-09-26, refused exactly that way.
        with:
          fetch-depth: 0

      - name: Mint the plugin-scoped App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.UNITARES_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.UNITARES_AGENT_APP_PRIVATE_KEY }}
          owner: cirwel
          repositories: unitares-governance-plugin
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cirwel/unitares-governance-plugin
          token: ${{ steps.app.outputs.token }}
          path: _plugin
          fetch-depth: 1

      - name: Sync the mirror and open or update the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UNITARES_REPO_DIR: ${{ github.workspace }}
          UNITARES_PLUGIN_REPO: ${{ github.workspace }}/_plugin
        run: |
          git config --global user.name "unitares-agents[bot]"
          git config --global user.email "342195540+unitares-agents[bot]@users.noreply.github.com"
          set +e
          out="$(bash scripts/dev/open-plugin-skill-sync-pr.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          # 2 = a hand-opened sync PR is already doing this; not a failure.
          if [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"
