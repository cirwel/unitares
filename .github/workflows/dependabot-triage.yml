name: dependabot-triage

# On-demand Dependabot triage for this repository. REPORT ONLY — never merges.
# Multi-repository targets and recurring schedules belong to the caller's
# deployment. The classification and coverage gate are tested in the repo.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Triage open Dependabot PRs
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/dev/dependabot_triage.py --repos "$GITHUB_REPOSITORY" > triage.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat triage.md >> "$GITHUB_STEP_SUMMARY"
          cat triage.md

      - name: Fail if repository coverage was incomplete
        if: steps.triage.outputs.exit_code != '0'
        run: |
          echo "::error::Dependabot triage could not read this repository." \
               "See the UNREACHABLE section."
          exit 1
