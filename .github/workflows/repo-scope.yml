name: Repo Scope Guard

# Keeps the user/agent-agnostic repo free of operator-personal material, career
# artifacts, and per-vendor agent config. This is the layer that catches cloud /
# web agent sessions, which bypass the local pre-commit hook. See docs/REPO_SCOPE.md.

on:
  merge_group:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, develop ]

permissions:
  contents: read
  # Write is needed for one narrow repair: agent harnesses append a session
  # attribution footer to the PR body *after* submission, so the author cannot
  # prevent it and every agent-opened PR failed this guard on its first run.
  # The workflow removes that footer rather than tolerating it — the link must
  # not sit in the public body. Fork PRs get a read-only token regardless, in
  # which case the guard falls back to failing, which is the correct outcome.
  pull-requests: write

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repo scope guard
        run: bash scripts/dev/check-repo-scope.sh --base "${{ steps.base.outputs.ref }}"

      # Agent harnesses append `_Generated by [Claude Code](.../session_X)_` to
      # the body after it is submitted, so the author cannot strip it before
      # opening the PR and the session check below failed on principle every
      # time. Silencing the check would be the wrong repair — the link would
      # still be published. This removes the footer and rewrites the body, then
      # the lint runs against what is actually on the PR now.
      #
      # Deliberately narrow (scripts/dev/pr_body_attribution.py, unit-tested in
      # tests/test_pr_body_attribution.py): ONLY a trailing attribution footer is
      # removed. A session link the author wrote into the description survives
      # and still fails below — this must not become a laundering step.
      - name: Normalize PR body (remove harness-appended attribution footer)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const script = 'scripts/dev/pr_body_attribution.py';
            const run = (args, input) =>
              execFileSync('python3', args, { input, encoding: 'utf8' });

            let body = process.env.PR_BODY || '';
            const status = JSON.parse(run([script, '--status'], body));

            if (status.stripped) {
              const stripped = run([script], body);
              try {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  body: stripped,
                });
                body = stripped;
                core.notice(
                  'Removed the harness-appended attribution footer from the PR body.'
                );
              } catch (e) {
                core.warning(
                  `Could not rewrite the PR body (${e.message}) — linting it as ` +
                  'published, so the session check below will fail as before.'
                );
              }
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr_body.txt`, body);

      # The file guard checks committed content; a PR description is not a file,
      # so lint it separately for operator-local paths and chat-session register.
      # Body read from a file (never inlined) to avoid script injection.
      - name: Lint PR body for local paths and chat register
        if: github.event_name == 'pull_request'
        run: |
          PR_BODY="$(cat "${RUNNER_TEMP}/pr_body.txt")"
          # Escape hatch for PRs that legitimately discuss these patterns (this
          # guard, register cleanups, meta-docs): add the HTML comment
          # <!-- scope-guard: allow-register --> to the PR body. Rare by design.
          if printf '%s' "$PR_BODY" | grep -q 'scope-guard: allow-register'; then
            echo "PR body register: allow-register marker present — skipping."
            exit 0
          fi
          failures=0
          bad_paths=$(printf '%s' "$PR_BODY" | grep -niE '/Users/cirwel' || true)
          if [ -n "$bad_paths" ]; then
            echo "::error::PR body leaks an operator-local path (/Users/cirwel). Use repo-relative paths, environment variables, or neutral checkout wording."
            printf '%s\n' "$bad_paths"
            failures=1
          fi

          bad_register=$(printf '%s' "$PR_BODY" | grep -niE 'per your guidance|your overlay|you flagged|questions for [Kk]enny|live-verifier|council pass|council fold' || true)
          if [ -n "$bad_register" ]; then
            echo "::error::PR body reads like a personal chat session. Rewrite third-person/imperative; move working notes out of the public record."
            printf '%s\n' "$bad_register"
            failures=1
          fi

          bad_session=$(printf '%s' "$PR_BODY" | grep -niE 'claude\.ai/code/session|Claude-Session:' || true)
          if [ -n "$bad_session" ]; then
            echo "::error::PR body carries a Claude Code session-attribution link. It ties the public repo to a private session and signals AI authorship. A trailing harness-appended footer is removed automatically by the step above, so this link is either written into the description itself (remove it) or the auto-strip could not rewrite the body (fork PRs get a read-only token — edit the description by hand)."
            printf '%s\n' "$bad_session"
            failures=1
          fi

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
          echo "PR body register: clean"

      # Commit messages are neither files nor the PR body, so they need their own
      # pass — the Claude Code session-attribution trailer lands there by default
      # and is the trailer's main vector into public history.
      #
      # Scoped to base..HEAD, so the commits already carrying it are not
      # retro-flagged. That is deliberate: as of 2026-08-09 master's recent
      # history holds ~160 of them, and rewriting shared history over a trailer
      # is not worth it (same call made for the original ~10). This stops the
      # next one; it does not relitigate the last hundred.
      - name: Lint PR commit messages for session-attribution links
        if: github.event_name == 'pull_request'
        run: |
          base="${{ steps.base.outputs.ref }}"
          bad=$(git log "${base}..HEAD" --format='%H %s%n%b' | grep -niE 'claude\.ai/code/session|Claude-Session:' || true)
          if [ -n "$bad" ]; then
            echo "::error::A PR commit message carries a Claude Code session link (claude.ai/code/session). Strip the Claude-Session trailer from commit messages."
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Commit messages: clean"
