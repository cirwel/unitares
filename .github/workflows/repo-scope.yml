name: Repo Scope Guard

# Keeps the user/agent-agnostic repo free of operator-personal material, career
# artifacts, and per-vendor agent config. This is the layer that catches cloud /
# web agent sessions, which bypass the local pre-commit hook. See docs/REPO_SCOPE.md.

on:
  merge_group:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repo scope guard
        run: bash scripts/dev/check-repo-scope.sh --base "${{ steps.base.outputs.ref }}"

      # The guard above is VENDOR neutrality; this one is FLEET neutrality —
      # no operator's resident names hardcoded in shipped source. It reports
      # the known couplings on every run and fails only on a NEW one.
      - name: Run fleet-identity guard
        run: python3 scripts/dev/check_fleet_identity_leak.py

      # docs/proposals/ is over half of all documentation here, and what keeps
      # it navigable is its index, not the folder. The index is hand-maintained
      # and had already drifted within ten days of being written — a row added
      # by #2156 with the summary count left behind, caught by nothing. This
      # checks coverage, dead links, count arithmetic and status lines. It does
      # not decide whether a disposition tag is right; that stays a human call.
      - name: Run proposals index guard
        run: python3 scripts/dev/check_proposals_index.py

      # Active proposals are read before someone acts on them, and several had
      # grown past 1,000 lines. New files there are capped at 800 lines; files
      # already over it are listed in scripts/dev/proposals_length_baseline.txt
      # and may shrink but not grow. --base stops a PR from raising its own entry.
      - name: Run proposals length ratchet
        run: python3 scripts/dev/check_proposals_length.py --base "${{ steps.base.outputs.ref }}"

      # The federation boundary (docs/proposals/active/federation-component-
      # boundaries-v0.md, Section 6): members use public surfaces, components own
      # their tables, no private reach across components. Violations that existed
      # when it was written are listed in
      # scripts/dev/component_boundaries_baseline.txt and may shrink but not
      # grow; --base stops a PR from adding or raising its own entry.
      - name: Run component boundary ratchet
        run: python3 scripts/dev/check_component_boundaries.py --base "${{ steps.base.outputs.ref }}"

      # AGENTS.md and CLAUDE.md are adapter-specific preambles over one shared
      # contract block, and both files (plus docs/dev/DRIFT_LEDGER.md) state
      # that CI enforces byte-parity between them. Until this step existed the
      # script was invoked by nothing outside prose, so the claim was unbacked
      # and the block could drift silently. This wires the stated contract; it
      # adds no new standard.
      - name: Run shared-contract parity guard
        run: bash scripts/dev/check-shared-contract.sh

      # The body is read live from the API: the webhook payload is frozen at
      # event time, and the lint is about what the PR says now.
      - name: Read PR body
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/pr_body.txt`, pr.body || '');

      # The file guard checks committed content; a PR description is not a file,
      # so lint it separately for machine-absolute home paths and chat-session register.
      # Body read from a file (never inlined) to avoid script injection.
      - name: Lint PR body for local paths and chat register
        if: github.event_name == 'pull_request'
        run: |
          PR_BODY="$(cat "${RUNNER_TEMP}/pr_body.txt")"
          # Escape hatch for PRs that legitimately discuss these patterns (this
          # guard, register cleanups, meta-docs): add the HTML comment
          # <!-- scope-guard: allow-register --> to the PR body. Rare by design.
          # It exempts the REGISTER check only; the home-path check always runs.
          allow_register=0
          if printf '%s' "$PR_BODY" | grep -q 'scope-guard: allow-register'; then
            echo "PR body register: allow-register marker present — register check skipped."
            allow_register=1
          fi
          failures=0
          # Same patterns as scripts/dev/check-repo-scope.sh Rule 8 (held
          # identical by tests/test_doc_contract_ci_wiring.py): any /Users/<name>
          # home path except a placeholder name such as /Users/you.
          HOME_PATH_RE='/Users/[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9_-])?'
          HOME_PLACEHOLDER_RE='^/Users/([A-Za-z0-9]|you|me|user|username|name|alice|bob|example|test|testuser|foo|runner|operator|op|someone|Shared)$'
          bad_paths=$(printf '%s\n' "$PR_BODY" | grep -oE "$HOME_PATH_RE" | grep -viE "$HOME_PLACEHOLDER_RE" | sort -u || true)
          if [ -n "$bad_paths" ]; then
            echo "::error::PR body leaks a machine-absolute home path. Use repo-relative paths, environment variables, or a placeholder such as /Users/you."
            printf '%s\n' "$bad_paths"
            failures=1
          fi

          bad_register=""
          if [ "$allow_register" -eq 0 ]; then
            bad_register=$(printf '%s' "$PR_BODY" | grep -niE 'per your guidance|your overlay|you flagged|questions for [Kk]enny|live-verifier|council pass|council fold' || true)
          fi
          if [ -n "$bad_register" ]; then
            echo "::error::PR body reads like a personal chat session. Rewrite third-person/imperative; move working notes out of the public record."
            printf '%s\n' "$bad_register"
            failures=1
          fi

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
          echo "PR body register: clean"
