name: Glama Bundle
on:
  pull_request:
    paths:
      - 'Dockerfile.glama'
      - 'src/**'
      - 'governance_core/**'
      - 'agents/**'
      - 'config/**'
      - 'dashboard/**'
      - 'skills/**'
      - 'VERSION'
      - 'docker/glama/**'
      - 'db/postgres/**'
      - 'requirements-docker.txt'
      - 'constraints.txt'
      - 'elixir/lease_plane/**'
      - 'elixir/unitares_sdk/**'
      - 'scripts/ci/check_glama_bundle.py'
      - 'scripts/ci/check_glama_proxy.py'
      - 'scripts/demo/coordination_demo.py'
      - '.github/workflows/glama-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-and-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile.glama -t unitares-glama:local .
      - run: python3 scripts/ci/check_glama_bundle.py --image unitares-glama:local
      - run: docker build -f docker/glama/Dockerfile.proxy-test -t unitares-glama:proxy-test .
      - run: python3 scripts/ci/check_glama_proxy.py
