name: Elixir Tests

# Closes the BEAM-vs-Python drift gap: the active Sentinel is the Elixir runtime
# (com.unitares.sentinel-beam), but until this workflow nothing ran its test
# suite in CI — so a regression in the BEAM forced-release poller (or any other
# elixir/sentinel module) could merge unvalidated. This runs `mix test` for the
# Sentinel app on every PR that touches it.
#
# Scope note: the `sentinel` job is DB-free — its test_helper.exs auto-detects
# Postgres and EXCLUDES :db-tagged integration tests when the DB is unreachable.
#
# The `lease_plane` job IS DB-backed: its test_helper.exs raises without a live
# governance DB + the lease_plane.*/effects.*/audit.*/core.* schema. Before this
# job, the entire BEAM lease-plane — including the RCE `file_write` execute path
# (commit / §5b rollback / the effects.payloads contract tests) — ran only
# locally and never gated a merge. It stands up the real Postgres+AGE image used
# by the documented quickstart (docker-initdb.sh applies every migration during
# init, before the healthcheck passes) and runs the full suite.

# `db/postgres/**` is in the filter because the `lease_plane` job runs against the
# real governance schema built by docker-initdb.sh — so a change under db/postgres
# can break it while nothing runs to catch that. 2026-08-01 is the worked example:
# an audit-partition timezone bug turned this job red on every branch, and a
# db-only PR fixing it would have shown the `lease_plane` check as ABSENT rather
# than green — the fix could not be validated by the job it repairs.
on:
  merge_group:
  push:
    branches: [ master, main ]
    paths:
      - 'elixir/sentinel/**'
      - 'elixir/lease_plane/**'
      - 'elixir/unitares_sdk/**'
      - 'elixir/dialectic_live/**'
      - 'db/postgres/**'
      - '.github/workflows/elixir-tests.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'elixir/sentinel/**'
      - 'elixir/lease_plane/**'
      - 'elixir/unitares_sdk/**'
      - 'elixir/dialectic_live/**'
      - 'db/postgres/**'
      - '.github/workflows/elixir-tests.yml'

# Least-privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

jobs:
  # The SDK is the shared BEAM governance contract, consumed across repos
  # (dispatch_beam, anima-mcp) by git ref. A regression here breaks clients
  # this repo's CI cannot see, so it gates on the loosest floor it claims to
  # support (Elixir 1.15) as well as current — a dep that silently requires a
  # newer Elixir than its mix.exs declares is a broken contract.
  unitares_sdk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floor. OTP 27 is the real floor: the SDK uses Erlang's
          # :json rather than Elixir's, precisely so 1.15 consumers can adopt it.
          - elixir: '1.15'
            otp: '27'
          - elixir: '1.19'
            otp: '27'

    defaults:
      run:
        working-directory: elixir/unitares_sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Elixir / OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}

    - name: Run tests
      # No deps.get: the SDK has zero third-party runtime dependencies, and a
      # deps step here would hide the day one of them appears.
      run: mix test

    - name: Check formatting
      if: matrix.elixir == '1.19'
      run: mix format --check-formatted

  # dialectic_live consumes unitares_sdk (Envelope only — its transport stays
  # Req). It had no job before; it also had no governance tests before, so
  # there was nothing for a job to protect. Both are true now: a change to the
  # shared envelope can blank this app's session pane, and the path filter
  # above fires this job on SDK changes as well as its own.
  dialectic_live:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: elixir/dialectic_live

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Elixir / OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        elixir-version: '1.19'

    - name: Cache deps and build
      uses: actions/cache@v6
      with:
        path: |
          elixir/dialectic_live/deps
          elixir/dialectic_live/_build
        key: ${{ runner.os }}-mix-dialectic_live-${{ hashFiles('elixir/dialectic_live/mix.lock', 'elixir/dialectic_live/mix.exs') }}
        restore-keys: |
          ${{ runner.os }}-mix-dialectic_live-

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests
      # DB-free: the suite covers the governance envelope contract and pure
      # helpers, not the LiveView-over-Postgres path.
      run: mix test

  sentinel:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: elixir/sentinel

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Elixir / OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        elixir-version: '1.19'

    - name: Cache deps and build
      uses: actions/cache@v6
      with:
        path: |
          elixir/sentinel/deps
          elixir/sentinel/_build
        key: ${{ runner.os }}-mix-sentinel-${{ hashFiles('elixir/sentinel/mix.lock', 'elixir/sentinel/mix.exs') }}
        restore-keys: |
          ${{ runner.os }}-mix-sentinel-

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests
      # No DB service: test_helper.exs excludes :db-tagged integration tests
      # when Postgres is unreachable, so the pure-logic suite runs green.
      run: mix test

  lease_plane:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # The lease_plane suite needs the real governance schema. Reuse the same
    # Postgres+AGE image the documented quickstart uses; docker-initdb.sh applies
    # every migration during init, and `--wait` blocks on the pg_isready
    # healthcheck, which only passes once init (and therefore the migrations) has
    # completed.
    - name: Bring up Postgres + AGE (migrations auto-applied)
      run: docker compose up postgres-age -d --wait --build

    - name: Set up Elixir / OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        elixir-version: '1.19'

    - name: Cache deps and build
      uses: actions/cache@v6
      with:
        path: |
          elixir/lease_plane/deps
          elixir/lease_plane/_build
        key: ${{ runner.os }}-mix-lease_plane-${{ hashFiles('elixir/lease_plane/mix.lock', 'elixir/lease_plane/mix.exs') }}
        restore-keys: |
          ${{ runner.os }}-mix-lease_plane-

    - name: Install dependencies
      working-directory: elixir/lease_plane
      run: mix deps.get

    - name: Run tests (real governance DB)
      working-directory: elixir/lease_plane
      env:
        UNITARES_LEASE_PLANE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/governance
      run: mix test

    - name: Postgres logs on failure
      if: failure()
      run: docker compose logs --no-color --tail=200 postgres-age

    - name: Tear down
      if: always()
      run: docker compose down -v
