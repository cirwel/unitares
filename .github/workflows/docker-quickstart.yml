name: Docker Quickstart

# Exercises the documented quickstart end to end so upstream image drift can't
# silently break it again. `apache/age:latest` floated PG17 -> PG18 and broke
# `docker compose up && make demo` with nothing to catch it; this job builds the
# real stack and runs the demo against it. Pure-stdlib demo (urllib), no paid
# model API — GITHUB_TOKEN only.
#
# Path-filtered: only runs when the build inputs change, so the common Python-only
# PR doesn't pay the image-build cost. "Build inputs" means the dependency
# resolution and the stack around it, NOT the application tree — `src/`,
# `agents/`, `config/`, `dashboard/` and `skills/` are all COPYed into the image
# but deliberately left unfiltered, because rebuilding on every Python PR is the
# cost this filter exists to avoid.
#
# `constraints.txt` is listed because Dockerfile:34 installs with `-c constraints.txt`:
# it co-determines the resolution with requirements-docker.txt on the same pip line,
# so a pin moving there changes the image exactly as a requirements edit does. It was
# missing until 2026-09-04; v2.21.0 escaped only because both in-range edits to it
# (#2058, #2060) happened to be comments.

on:
  push:
    branches: [ master, main ]
    paths:
      - 'db/postgres/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'constraints.txt'
      - 'elixir/lease_plane/**'
      - 'elixir/unitares_sdk/**'
      - 'requirements*.txt'
      - 'scripts/demo/coordination_demo.py'
      - 'scripts/demo/quick_demo.py'
      - 'scripts/ci/check_mcp_tool_surface.py'
      - '.github/workflows/docker-quickstart.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'db/postgres/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'constraints.txt'
      - 'elixir/lease_plane/**'
      - 'elixir/unitares_sdk/**'
      - 'requirements*.txt'
      - 'scripts/demo/coordination_demo.py'
      - 'scripts/demo/quick_demo.py'
      - 'scripts/ci/check_mcp_tool_surface.py'
      - '.github/workflows/docker-quickstart.yml'

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and start the documented stack
        run: docker compose up -d --wait --build

      - name: Assert PG / AGE / pgvector versions
        run: |
          set -euo pipefail
          versions=$(docker exec unitares-postgres-age psql -U postgres -d governance -tAc \
            "SELECT extname||'='||extversion FROM pg_extension WHERE extname IN ('age','vector') ORDER BY extname;")
          echo "$versions"
          echo "$versions" | grep -qx 'age=1.7.0'   || { echo "::error::AGE not 1.7.0"; exit 1; }
          echo "$versions" | grep -qx 'vector=0.8.3' || { echo "::error::pgvector not 0.8.3"; exit 1; }

      - name: Run the quickstart demo against the stack
        run: make demo

      - name: Run the two-agent coordination proof
        run: make coordination-demo

      # The dashboard's System Health card reads /health/deep. A check that
      # errors on a fresh install (e.g. an import missing from the image)
      # paints a new operator's first screen "critical" while every demo
      # above still passes. Degraded is allowed: a fresh stack has no
      # embedding model loaded, so semantic search is honestly unavailable.
      - name: Deep health reports no failing checks
        run: |
          # No -f: a failing stack answers 503 with the JSON we need to read.
          # Only 200 and 503 are health answers; anything else (a 401 after an
          # auth regression, a proxy error page) must fail the step, not be
          # read as an empty report.
          code=""
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/deep.json -w '%{http_code}' http://localhost:8767/health/deep || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              python3 -c 'import json,sys; sys.exit(0 if json.load(open("/tmp/deep.json")).get("status") != "unavailable" else 1)' && break
            fi
            sleep 3
          done
          python3 - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          if code not in ("200", "503"):
              sys.exit(f"/health/deep answered HTTP {code or 'nothing'}, not a health report")
          body = json.load(open("/tmp/deep.json"))
          status = body.get("status")
          checks = body.get("checks")
          if status not in {"healthy", "moderate", "critical"} or not isinstance(checks, dict) or not checks:
              sys.exit(f"/health/deep body is not a health report: status={status!r}, checks={type(checks).__name__}")
          failing = (body.get("operator_summary") or {}).get("failing_checks") or []
          errors = sorted(k for k, v in checks.items() if isinstance(v, dict) and v.get("status") == "error")
          print(f"deep health: {status} (HTTP {code}) | {len(checks)} checks | failing: {failing} | errors: {errors}")
          sys.exit(1 if failing or errors else 0)
          PY

      - name: Verify progressive MCP discovery and complete federation contract
        run: docker compose exec -T governance-mcp python - --mode progressive < scripts/ci/check_mcp_tool_surface.py

      - name: Verify full MCP advertisement override
        run: |
          printf 'UNITARES_TOOL_ADVERTISEMENT=full\n' > .env
          docker compose up -d --build --wait --force-recreate governance-mcp
          docker compose exec -T governance-mcp python - --mode full < scripts/ci/check_mcp_tool_surface.py

      - name: Verify legacy mode does not replace the progressive default
        run: |
          printf 'GOVERNANCE_TOOL_MODE=minimal\n' > .env
          docker compose up -d --build --wait --force-recreate governance-mcp
          docker compose exec -T governance-mcp python - --mode progressive < scripts/ci/check_mcp_tool_surface.py

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
