name: Homebrew release sync

# A published stable tag gets one deterministic, release-owned source archive
# and one draft tap PR. The protected environment is the authority boundary:
# this workflow never marks the PR ready, labels it for merge, or merges it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to sync (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-release-sync
  cancel-in-progress: false

jobs:
  source_archive:
    outputs:
      version: ${{ steps.archive.outputs.version }}
      commit: ${{ steps.archive.outputs.commit }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      url: ${{ steps.archive.outputs.url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: >-
      github.repository == 'cirwel/unitares' &&
      vars.UNITARES_HOMEBREW_RELEASE_SYNC_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    environment: homebrew-release-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Verify protected environment arming secret
        env:
          ARMED: ${{ secrets.UNITARES_HOMEBREW_RELEASE_SYNC_ARMED }}
        run: test "$ARMED" = true

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build or verify the deterministic release archive
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vX.Y.Z" >&2
            exit 1
          }
          version=${TAG#v}
          test "$TAG" = "v$version"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n 1 "$TAG")" = "$commit"
          # The signing certificate describes the workflow's event context,
          # not an arbitrary ref passed to checkout. Manual dispatch must use
          # --ref "$TAG", and the tag must contain this workflow version.
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$commit"
          archive="$RUNNER_TEMP/unitares-$version.tar.gz"
          git archive --format=tar --prefix="unitares-$version/" "$commit" | gzip -n -9 > "$archive"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          existing="$RUNNER_TEMP/existing-unitares-$version.tar.gz"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "unitares-$version.tar.gz" --output "$existing" 2>/dev/null; then
            test "$(sha256sum "$existing" | cut -d' ' -f1)" = "$digest" || {
              echo "existing release asset differs; refusing to overwrite it" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/cirwel/unitares/releases/download/$TAG/unitares-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "UNITARES_VERSION=$version" >> "$GITHUB_ENV"
          echo "UNITARES_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "UNITARES_ARCHIVE_SHA256=$digest" >> "$GITHUB_ENV"
          echo "UNITARES_ARCHIVE_URL=https://github.com/cirwel/unitares/releases/download/$TAG/unitares-$version.tar.gz" >> "$GITHUB_ENV"

      - name: Attest the source archive from this release commit
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/unitares-${{ env.UNITARES_VERSION }}.tar.gz

      - name: Verify provenance before publishing the source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/unitares-$UNITARES_VERSION.tar.gz"
          gh attestation verify "$archive" --repo cirwel/unitares \
            --signer-workflow cirwel/unitares/.github/workflows/homebrew-release-sync.yml \
            --source-ref "refs/tags/$TAG" --source-digest "$UNITARES_COMMIT" \
            --signer-digest "$UNITARES_COMMIT" --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/source-verification.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/source-verification.json"
          existing="$RUNNER_TEMP/published-unitares-$UNITARES_VERSION.tar.gz"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "unitares-$UNITARES_VERSION.tar.gz" --output "$existing" 2>/dev/null; then
            cmp "$archive" "$existing"
          else
            gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY"
          fi

  # Tap main is a separate trust domain. Its renderer must never inherit the
  # upstream signing identity or the credential that can replace release assets.
  sync:
    needs: source_archive
    permissions:
      contents: read
      pull-requests: read
    environment: homebrew-release-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      UNITARES_VERSION: ${{ needs.source_archive.outputs.version }}
      UNITARES_COMMIT: ${{ needs.source_archive.outputs.commit }}
      UNITARES_ARCHIVE_SHA256: ${{ needs.source_archive.outputs.sha256 }}
      UNITARES_ARCHIVE_URL: ${{ needs.source_archive.outputs.url }}
    steps:
      - name: Verify protected environment arming secret
        env:
          ARMED: ${{ secrets.UNITARES_HOMEBREW_RELEASE_SYNC_ARMED }}
        run: test "$ARMED" = true

      - name: Check out the verified release commit for the renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source_archive.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Mint a tap-scoped App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.UNITARES_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.UNITARES_AGENT_APP_PRIVATE_KEY }}
          owner: cirwel
          repositories: homebrew-unitares
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cirwel/homebrew-unitares
          token: ${{ steps.app.outputs.token }}
          path: _tap
          persist-credentials: true
          fetch-depth: 0

      - name: Render, verify and open the draft tap PR
        working-directory: _tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          UPSTREAM_GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=auto/homebrew-release-sync
          remote_ref="refs/remotes/origin/$branch"
          lease="--force-with-lease=refs/heads/$branch:"
          if git show-ref --verify --quiet "$remote_ref"; then
            expected_remote="$(git rev-parse "$remote_ref")"
            authors="$(git log --format='%ae' "origin/main..$remote_ref")"
            while IFS= read -r author; do
              if [ -n "$author" ] && \
                  [ "$author" != '342195540+unitares-agents[bot]@users.noreply.github.com' ]; then
                echo "automation branch contains a non-bot commit; refusing to overwrite it" >&2
                exit 1
              fi
            done <<< "$authors"
            git checkout -B "$branch" "$remote_ref"
            git reset --hard origin/main
            lease="--force-with-lease=refs/heads/$branch:$expected_remote"
          else
            git checkout -B "$branch" origin/main
          fi
          floor_pr="$(jq -r .release_floor_pr SOURCES.json)"
          floor_commit="$(GH_TOKEN="$UPSTREAM_GH_TOKEN" gh pr view "$floor_pr" \
            --repo cirwel/unitares --json state,mergeCommit \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          test -n "$floor_commit"
          python3 scripts/release_sync.py \
            --source-root "$GITHUB_WORKSPACE" \
            --release-repo "$GITHUB_WORKSPACE" \
            --version "$UNITARES_VERSION" --tag "$TAG" \
            --commit "$UNITARES_COMMIT" \
            --archive-url "$UNITARES_ARCHIVE_URL" \
            --archive-sha256 "$UNITARES_ARCHIVE_SHA256" \
            --release-floor-commit "$floor_commit"
          python3 scripts/release_sync.py \
            --source-root "$GITHUB_WORKSPACE" \
            --release-repo "$GITHUB_WORKSPACE" \
            --version "$UNITARES_VERSION" --tag "$TAG" \
            --commit "$UNITARES_COMMIT" \
            --archive-url "$UNITARES_ARCHIVE_URL" \
            --archive-sha256 "$UNITARES_ARCHIVE_SHA256" \
            --release-floor-commit "$floor_commit" --check
          python3 scripts/test_release_sync.py
          git config user.name "unitares-agents[bot]"
          git config user.email "342195540+unitares-agents[bot]@users.noreply.github.com"
          git add Formula/unitares.rb Formula/unitares-lease-plane.rb SOURCES.json
          if git diff --cached --quiet; then
            echo "Tap already matches $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(release): sync UNITARES $TAG"
          git push "$lease" --force-if-includes origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/homebrew-pr-body.md"
          printf '%s\n' \
            "This draft updates the tap to UNITARES $TAG at $UNITARES_COMMIT." \
            "" \
            "Evidence:" \
            "- immutable release asset: $UNITARES_ARCHIVE_URL" \
            "- SHA-256: $UNITARES_ARCHIVE_SHA256" \
            "- the renderer verifies the release contains the native updater and every tracked source before it may remove any remaining v3.5.0 DATA backport" \
            "" \
            "Keep this draft until installed Apple Silicon acceptance passes. This workflow never publishes bottles or authorizes merge." \
            > "$body"
          existing="$(gh pr list --repo cirwel/homebrew-unitares --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo cirwel/homebrew-unitares \
              --title "chore(release): sync UNITARES $TAG" --body-file "$body"
          else
            gh pr create --repo cirwel/homebrew-unitares --base main --head "$branch" \
              --draft --title "chore(release): sync UNITARES $TAG" --body-file "$body"
          fi
