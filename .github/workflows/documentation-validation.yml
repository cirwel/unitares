name: Documentation Validation

on:
  merge_group:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Validate CI/Python version sync and the interpreter contract
      # check_ci_python_matrix_sync.py parses tests.yml, so it needs PyYAML
      # (a core dependency; pinned as in pyproject). This job installs
      # nothing else on purpose, and the checker fails rather than skips when
      # it cannot import what it needs.
      run: |
        python -m pip install "PyYAML>=6.0.0,<7.0.0"
        python scripts/dev/check_ci_python_version_sync.py
        python scripts/diagnostics/check_ci_python_matrix_sync.py

    - name: Validate tool count synchronization (skips without runtime deps)
      # This job deliberately installs no project dependencies, so the runtime
      # registry cannot be imported and this step SKIPS rather than enforces.
      # It is kept for the case where deps become available; the binding
      # enforcement lives in the `smoke` job of the Tests workflow, which runs
      # the same script with --require-registry against a real registry.
      env:
        PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      run: |
        echo "🔍 Checking tool count..."
        python scripts/diagnostics/update_docs_tool_count.py --check

    - name: Validate version consistency
      run: |
        echo "🔍 Checking version consistency..."
        python scripts/ops/version_manager.py --check

    - name: Validate reader-facing documentation health
      run: |
        echo "🔍 Checking documentation references, counts, and contested claims..."
        python scripts/diagnostics/check_doc_health.py --strict

    - name: Display tool count breakdown
      if: success()
      env:
        PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      run: |
        echo "📊 Current tool inventory:"
        python scripts/diagnostics/count_tools.py --by-module

    - name: Comment on PR with validation results
      if: github.event_name == 'pull_request' && success()
      continue-on-error: true
      env:
        PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const { execSync } = require('child_process');

          // Read the count through --json, which carries an explicit
          // `available` flag. This runner installs no project dependencies, so
          // the count is normally UNAVAILABLE — and unavailable must never
          // render as a number. The previous version captured stdout only,
          // dropping the stderr warning and publishing the sentinel `0` under
          // a green heading, which reads as "this repo advertises zero tools":
          // instrumentation failing toward healthy instead of toward unknown.
          let count;
          try {
            count = JSON.parse(
              execSync('python scripts/diagnostics/count_tools.py --json').toString()
            );
          } catch (err) {
            count = {
              available: false,
              reason: `the counter did not produce a count (${String(err.message).split('\n')[0]})`,
            };
          }

          const version = execSync('python scripts/ops/version_manager.py').toString().trim().split('\n')[0].replace('Current version: ', '');

          const toolCountLine = count.available
            ? `**Tool Count:** ${count.total} tools`
            : `**Tool Count:** unavailable — the runtime registry could not be read here (\`${count.reason}\`)`;

          const body = [
            '## ✅ Documentation Validation Passed',
            '',
            toolCountLine,
            `**Version:** ${version}`,
            '',
            'Passed the CI/Python, version-consistency, and reader-facing',
            'documentation-health checks.',
          ];

          if (count.available) {
            body.push('The tool-inventory check passed against the live registry.');
          } else {
            body.push(
              '',
              '> **The tool-inventory check was skipped, not passed.** This runner',
              '> installs no project dependencies, so the tool count could not be',
              '> taken and no number above is an inventory. The count is enforced',
              '> by the `smoke` job in the Tests workflow, which installs the',
              '> runtime dependencies and fails on an unavailable registry.'
            );
          }

          const comment = body.join('\n');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
