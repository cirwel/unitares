name: Review Gate

# Sets the `review` check on a PR's head: success only when a review
# record exists for the PR's CURRENT diff and it is clean or its findings are
# disposed. Records are PR comments posted by scripts/dev/review.sh (or its
# `record` subcommand for a council/human review); scripts/dev/review_gate.py
# documents the format and the diff key.
#
# Why pull_request_target: a fork's `pull_request` token cannot write a commit
# status. This job never executes PR code — it checks out the BASE branch (the
# trusted review_gate.py) and fetches the PR head only as git objects to hash.
# Keep it that way: no step may run, source, or install anything from the head.
#
# Why issue_comment: the record arrives as a comment, after CI has already run
# on the push. The comment event re-evaluates the head without a new push.
# Edits and deletions re-evaluate too, whatever the body now says: a record
# edited away or deleted must not leave its green status standing.
# Native Codex clean comments and submitted reviews are evidence too. Missing
# review and reviewer outages produce a neutral warning; findings need action.
# Fork review events have read-only tokens; their native summary comment
# re-evaluates through issue_comment using the trusted base workflow instead.
#
# GITHUB_TOKEN only; no model is called here (execution-cost policy). The
# review itself runs on the author's side.

on:
  pull_request_target:
    # edited: a PR retargeted to another base has a different diff on the same head.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
  # During rollout the checked-out default branch may still use commit statuses.
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      ((github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
        (github.event.action != 'created' || contains(github.event.comment.body, 'unitares-review v1') ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set review evidence check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/dev/review_gate.py --pr "$PR" ci --repo "$GITHUB_REPOSITORY" --post-status
