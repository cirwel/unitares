name: Merge Content Check

# Post-merge verification for the PR-#1610 loss mode (2026-08-12): a PR
# merged green while the branch's final pushed commit was silently absent
# from master. On every merge to master, recover the branch's latest actual
# pushed tip from the repo event stream and verify the merged head contains
# it; if not, fail the run and file a ci-finding issue naming the missing
# commits. Unverifiable cases (events window exceeded, compare unavailable)
# report as DEGRADED — never as silence.
#
# GITHUB_TOKEN-only — no metered APIs (execution-cost policy).

on:
  pull_request:
    types: [closed]
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checkout the BASE ref, not the default PR merge ref: the merge ref
      # of a closed PR is not guaranteed to resolve, and only the guard
      # script is needed — which lives on the base side by definition.
      - name: Checkout base (guard scripts only — no history needed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Verify the branch's final push is contained in the merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: python3 scripts/ci/merge_content_check.py
