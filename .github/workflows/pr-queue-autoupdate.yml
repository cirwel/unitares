name: PR Queue Auto-Update

# Poor-man's merge queue for a user-owned repo (GitHub's native merge queue
# requires an organization-owned repo). Branch protection on master requires
# branches to be up to date before merging, so every merge invalidates every
# other open PR and a human had to click "Update branch" serially. This
# workflow does that click.
#
# Queue semantics — deliberately ONE PR per run:
#   - Queue membership: open, non-draft PRs with auto-merge enabled OR the
#     `queued` label. Draft PRs are never touched (repo convention: draft =
#     "visible, not claiming merge"; marking ready / queueing stays a
#     deliberate maintainer action).
#   - Head of queue: oldest by creation date, skipping conflicted (DIRTY)
#     PRs — those need human conflict resolution and must not block others.
#   - Action: only if the head is BEHIND master, call the update-branch API
#     on that ONE PR. Anything else (CI running, already up to date) means
#     wait — updating more PRs per run would fan CI out across the whole
#     queue and burn minutes on branches that get invalidated by the next
#     merge anyway.
#   - When the head merges, the push-to-master event fires this workflow
#     again and the next PR advances. The schedule is a safety net for
#     missed events; workflow_dispatch for manual nudges.
#
# TOKEN REQUIREMENT (why this needs a PAT, not GITHUB_TOKEN): commits created
# with the default GITHUB_TOKEN do not trigger other workflows (GitHub's
# recursion guard), so an update-branch merge commit made with it would leave
# the PR's required checks stuck at "Expected — waiting for status". Add a
# fine-grained PAT as the repo secret PR_AUTOUPDATE_TOKEN (this repo only;
# permissions: Contents RW + Pull requests RW) and update commits re-run CI
# normally. Without the secret the workflow no-ops with a loud job summary
# instead of silently wedging PRs. Execution-cost policy: a PAT is free —
# no metered API on any path (GITHUB_TOKEN-only CI rule refers to metered
# model actions, and nothing here calls a model).
#
# Operator setup (one-time):
#   1. Settings → General → enable "Allow auto-merge".
#   2. Create the fine-grained PAT above; add as secret PR_AUTOUPDATE_TOKEN.
#   3. Per PR: approve → enable auto-merge (or add the `queued` label) → done.

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '17 * * * *'   # hourly safety net (anchored off :00 to dodge load spikes)
  workflow_dispatch:

permissions:
  contents: read        # the update-branch write goes through the PAT, not GITHUB_TOKEN
  pull-requests: read

concurrency:
  group: pr-queue-autoupdate
  cancel-in-progress: false

jobs:
  advance-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Update the oldest queued PR that is behind master
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOUPDATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "${GH_TOKEN:-}" ]; then
            summary "## PR queue auto-update: not configured"
            summary "Secret \`PR_AUTOUPDATE_TOKEN\` is missing, so no PR was updated."
            summary "GITHUB_TOKEN cannot be used here: its pushes do not re-trigger CI,"
            summary "which would leave updated PRs stuck at *Expected — waiting for status*."
            summary "Add a fine-grained PAT (this repo; Contents RW + Pull requests RW)."
            exit 0
          fi

          # mergeStateStatus: BEHIND (needs update), DIRTY (conflicts, needs a
          # human), BLOCKED/UNSTABLE (checks running or required reviews),
          # CLEAN (auto-merge will land it). Queue = oldest first.
          queue="$(gh pr list -R "$REPO" --state open --limit 100 \
                   --json number,title,isDraft,autoMergeRequest,labels,mergeStateStatus,createdAt \
                 | jq '[ .[]
                         | select(.isDraft | not)
                         | select((.autoMergeRequest != null)
                                  or ([.labels[].name] | index("queued")))
                       ] | sort_by(.createdAt)')"

          count="$(echo "$queue" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            summary "## PR queue auto-update: queue empty"
            summary "No open, non-draft PR has auto-merge enabled or the \`queued\` label."
            exit 0
          fi

          summary "## PR queue auto-update"
          summary "Queue ($count): $(echo "$queue" | jq -r '[.[] | "#\(.number) [\(.mergeStateStatus)]"] | join(", ")')"

          head_pr="$(echo "$queue" | jq '[ .[] | select(.mergeStateStatus != "DIRTY") ] | .[0] // empty')"
          dirty="$(echo "$queue" | jq -r '[ .[] | select(.mergeStateStatus == "DIRTY") | "#\(.number)"] | join(", ")')"
          [ -n "$dirty" ] && summary "Skipped (merge conflicts, need a human): $dirty"

          if [ -z "$head_pr" ]; then
            summary "Every queued PR has conflicts — nothing to advance."
            exit 0
          fi

          number="$(echo "$head_pr" | jq -r '.number')"
          status="$(echo "$head_pr" | jq -r '.mergeStateStatus')"

          if [ "$status" != "BEHIND" ]; then
            summary "Head of queue #$number is \`$status\` — waiting (update only fires on \`BEHIND\`)."
            exit 0
          fi

          echo "Updating PR #$number (behind master)"
          gh api --method PUT "repos/$REPO/pulls/$number/update-branch"
          summary "Updated **#$number** — CI re-runs on the merge commit; auto-merge lands it when green."
