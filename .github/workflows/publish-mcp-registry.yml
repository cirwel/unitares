name: Publish MCP Registry

# Lists UNITARES in the official MCP Registry (registry.modelcontextprotocol.io)
# as io.github.cirwel/unitares. The entry is metadata only: name, description,
# repository and website, with no package. The install is the Compose stack in
# the README, and the GHCR server image does not run on its own (it needs the
# Compose Postgres with AGE and pgvector, and Redis), so a package entry would
# tell a client to launch something that cannot start.
#
# The registry version follows PUBLISHED_VERSION, the release the README's
# install one-liner serves. It advances only when a promote-release PR merges,
# which is what triggers this workflow. A version the registry already holds
# is skipped, because the registry rejects republishing one.
#
# Authentication is GitHub OIDC: the io.github.cirwel namespace is granted to
# workflows running in a cirwel repository, so no token or operator login is
# stored anywhere.

on:
  push:
    branches: [master]
    paths:
      - PUBLISHED_VERSION
      - server.json
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISHER_VERSION: v1.8.1
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  SERVER_NAME: io.github.cirwel/unitares

jobs:
  publish:
    # A manual dispatch can name any ref, and the job's OIDC token can publish
    # or overwrite any io.github.cirwel/* entry, so only master's reviewed
    # server.json may reach the registry.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stamp the published version
        id: version
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < PUBLISHED_VERSION)
          jq --arg v "$version" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip a version the registry already holds
        id: existing
        run: |
          set -euo pipefail
          name=$(jq -rn --arg n "$SERVER_NAME" '$n|@uri')
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/${{ steps.version.outputs.version }}")
          if [ "$status" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SERVER_NAME ${{ steps.version.outputs.version }} is already in the registry."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate
        if: steps.existing.outputs.skip != 'true'
        run: ./mcp-publisher validate

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
