name: Tests

on:
  merge_group:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

# Least-privilege default for GITHUB_TOKEN: every job here only reads the repo
# and runs tests (checkout, pip/npm install, pytest/vitest, artifact upload) —
# none push, comment, or release. Pins the token to read-only (CodeQL finding).
permissions:
  contents: read

# Only the newest revision of a branch is actionable. Cancel superseded runs so
# an active PR does not consume sixteen database-backed runners for stale commits.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Don't persist GITHUB_TOKEN as a git credential, otherwise pip's
        # `git clone` of unitares-core (or any other public repo) sends it
        # as a 401-eliciting auth header and falls back to a no-TTY prompt.
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements-full.txt
          constraints.txt

    - name: Install dependencies
      # -c constraints.txt pins drift-bitten deps to the production resolution;
      # the blocking mcp-newest job covers the unconstrained resolution.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-full.txt -c constraints.txt

    - name: Validate CI/Python version sync
      run: |
        python scripts/dev/check_ci_python_version_sync.py

    - name: Validate the interpreter contract (floor, production marker, Dockerfile, ops templates, CI matrix)
      run: |
        python scripts/diagnostics/check_ci_python_matrix_sync.py

    - name: Check doc drift
      run: |
        python scripts/diagnostics/check_doc_drift.py

    - name: Check glossary drift (doc <-> code <-> viewer)
      # Deterministic replacement for the manual glossary drift sweeps: the
      # doc glossary must parse (it feeds the generated public-site viewer),
      # its path.py::symbol references must resolve, and it must stay
      # cross-referenced with src/governance_glossary.py.
      run: |
        python scripts/dev/check_glossary_drift.py

    - name: Validate skills manifest (canonical fingerprint)
      # Fails if skills/ changed without regenerating SKILLS_MANIFEST.sha256.
      # Keeps the canonical fingerprint honest so the plugin mirror can verify
      # against it; the always-on CI guard the ship.sh-only S15-d gate lacked.
      run: |
        python scripts/dev/skills_manifest.py --check

    - name: Validate skill freshness (last_verified within freshness_days)
      # Date-age check only (SKILL_FRESHNESS_AGE_ONLY=1): a skill whose
      # last_verified is older than its freshness_days window blocks the PR.
      # The richer source-file-mtime check stays LOCAL (ship.sh / pre-commit) —
      # it reads filesystem mtime, which a fresh CI checkout rewrites to "now",
      # so in CI it would false-flag every skill not verified on the run date.
      env:
        SKILL_FRESHNESS_AGE_ONLY: "1"
      run: |
        bash scripts/client/check-skill-freshness.sh

    - name: Validate tool-mode / schema config
      # DB-free: confirms TOOL_CATEGORIES matches the tool schema (alias-aware)
      # and minimal/lite keep their discovery tools, so TOOL_MODE filtering stays
      # consistent with the served surface.
      run: |
        python scripts/diagnostics/validate_tool_modes.py

    - name: Dead-code gate (unused imports)
      run: |
        pip install "ruff>=0.15"
        ruff check .

    - name: Lint Dockerfiles for floating image tags
      # Fails the build if any Dockerfile/compose base image floats (`:latest`
      # or untagged). DB-free doctor check, so it runs without a live Postgres.
      run: |
        python - <<'PY'
        import sys
        from pathlib import Path
        sys.path.insert(0, "scripts/dev")
        import unitares_doctor as d
        r = d.check_dockerfile_pinned_tags(Path("."))
        print(f"[{r.status.value.upper()}] {r.message}")
        if r.detail:
            print(r.detail)
        sys.exit(1 if r.status == d.Status.FAIL else 0)
        PY

    - name: Check generated docs are fresh
      # Fails the build if a generated doc has drifted from its source. None of
      # these need a live DB, so they run in the smoke job. flag/ports read the
      # tree (AST / config); tool_edge_index imports the handler package and
      # reads the live registries — deliberately, since the dispatch edges it
      # indexes exist only after import. Re-run the named generator to fix.
      run: |
        python3 scripts/dev/flag_catalog.py --check
        python3 scripts/dev/ports_catalog.py --check
        python3 scripts/dev/tool_edge_index.py --check

    - name: Deploy-script contract (shared lib, no re-inlined blocks)
      run: |
        bash scripts/dev/check-deploy-lib.sh

    - name: Run smoke tests
      run: |
        make test-smoke

    - name: Run tool count validation
      continue-on-error: true
      run: |
        python scripts/diagnostics/count_tools.py --json

    - name: Validate documentation tool count against the live registry
      # The binding tool-inventory gate. The documentation-validation workflow
      # installs no dependencies, so its own --check can only SKIP: it compares
      # nothing and enforces nothing. This job has the full runtime tree, so
      # the count here is real, and --require-registry turns an unimportable
      # registry into a failure rather than a silent skip — the check must fail
      # toward "unknown", never toward "healthy".
      run: |
        python scripts/diagnostics/update_docs_tool_count.py --check --require-registry

  test_shard:
    name: test shard (${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The leg whose coverage data feeds the repository floor. Kept at the
      # requires-python floor so adding interpreters cannot change what the
      # floor measures: a line reachable only under one interpreter would
      # otherwise count. tests/test_ci_test_gate.py pins this to the floor.
      COVERAGE_LEG: '3.12'

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the .python-version dev default and the requires-python
        # floor. 3.14 is the production interpreter's minor series (the
        # LaunchAgent runs 3.14.0, the Docker digest pins its own patch, and
        # setup-python resolves the newest 3.14.x; patch parity is not
        # claimed): constraints.txt declares
        # it (`# production-python:`), the Dockerfile base image and the
        # LaunchAgent templates under scripts/ops carry it, and
        # check_ci_python_matrix_sync.py holds all of those and this list to
        # one value, and checks that the setup-python step below consumes
        # the matrix. Until 2026-09-02 the pytest suite ran on 3.12 only;
        # the only 3.14 exercise CI had was docker-quickstart's demo, which
        # runs no tests. The floor leg is the coverage leg (COVERAGE_LEG);
        # the production leg is pass/fail evidence. Every leg feeds the
        # required `test (3.12)` context below, so a 3.14 regression blocks
        # merge.
        python-version: ['3.12', '3.14']
        # Top-level tests are split by filename using recent Actions timing.
        # The eight groups target roughly 2-3 minutes of test execution each;
        # nested tests and agents keep a dedicated shard. Each job gets its own
        # DB and filesystem, avoiding the shared-state hazards of pytest-xdist.
        shard: [tests-a-b, tests-c-d, tests-e-h, tests-i-l, tests-m-p, tests-q-t, tests-u-z, agents-and-nested]

    # Without a database, 333 tests across 29 modules skip themselves — every
    # migration test among them. The suite went green while the riskiest surface
    # in the repo was verified by nobody. Credentials match tests/test_db_utils
    # TEST_DB_URL exactly (postgres:postgres@localhost:5432/governance_test).
    #
    # pgvector's image, not stock `postgres`: the migrations `CREATE EXTENSION
    # vector`, and a stock image fails 67 tests with "extension vector is not
    # available". That was invisible until the tests actually ran here — the
    # dev machine has pgvector installed, so a local from-scratch database
    # proved nothing about this.
    #
    # Still NOT an AGE image. The schema bootstrap treats `LOAD 'age'` as
    # best-effort and the graph-dependent tests skip when the extension is
    # absent, so the remaining gap costs four skips rather than a red build.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Don't persist GITHUB_TOKEN as a git credential, otherwise pip's
        # `git clone` of unitares-core (or any other public repo) sends it
        # as a 401-eliciting auth header and falls back to a no-TTY prompt.
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements-full.txt
          constraints.txt

    - name: Install dependencies
      # -c constraints.txt pins drift-bitten deps to the production resolution;
      # the blocking mcp-newest job covers the unconstrained resolution.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-full.txt -c constraints.txt

    - name: Create test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -c 'CREATE DATABASE governance_test'

    - name: Run ${{ matrix.shard }} tests with coverage
      env:
        COVERAGE_FILE: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
      run: |
        case "${{ matrix.shard }}" in
          tests-a-b)
            targets=(tests/test_[a-b]*.py)
            ;;
          tests-c-d)
            targets=(tests/test_[c-d]*.py)
            ;;
          tests-e-h)
            targets=(tests/test_[e-h]*.py)
            ;;
          tests-i-l)
            targets=(tests/test_[i-l]*.py)
            ;;
          tests-m-p)
            targets=(tests/test_[m-p]*.py)
            ;;
          tests-q-t)
            targets=(tests/test_[q-t]*.py)
            ;;
          tests-u-z)
            targets=(tests/test_[u-z]*.py)
            ;;
          agents-and-nested)
            targets=(agents/ tests/*/ tests/smoke_test.py)
            ;;
          *)
            echo "unknown test shard: ${{ matrix.shard }}" >&2
            exit 2
            ;;
        esac

        covargs=()
        if [ "${{ matrix.python-version }}" = "$COVERAGE_LEG" ]; then
          covargs=(--cov=src --cov=agents/sdk/src/unitares_sdk --cov=agents --cov-report=)
        fi
        python -m pytest "${targets[@]}" -q -ra \
          "${covargs[@]}" --durations=25 --durations-min=0.5

    - name: Upload shard coverage data
      if: ${{ always() && matrix.python-version == env.COVERAGE_LEG }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-data-${{ matrix.python-version }}-${{ matrix.shard }}
        path: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 1

  test:
    # Preserve the branch-protection context while the expensive work fans out
    # above. `always()` plus the explicit shard guard ensures a failed matrix
    # leg cannot turn this required check into a harmless skip. The context
    # name is fixed by branch protection; since 2026-09-02 it gates every
    # interpreter leg of the matrix, not only 3.12, and the per-leg step
    # below names the leg that failed. Renaming the context means updating
    # the protection rule in the same change.
    name: test (3.12)
    if: ${{ always() }}
    needs: test_shard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # list this run's jobs (the per-leg check below)
    env:
      COVERAGE_LEG: '3.12'
      # versions x shards in the test_shard matrix; tests/test_ci_test_gate.py
      # recomputes it from the matrix so the two cannot drift.
      EXPECTED_SHARD_LEGS: '16'

    steps:
    - name: Require every test shard to pass
      if: ${{ needs.test_shard.result != 'success' }}
      run: |
        echo "one or more test shards failed or were cancelled" >&2
        exit 1

    - name: Require every shard leg of this attempt to pass
      # `needs.test_shard.result` is one value collapsed over sixteen legs.
      # GitHub lets a single failed leg be re-run alone, and that re-run can
      # report the job as success while another leg's failure from the
      # earlier attempt still stands (github.com/orgs/community/discussions/26822).
      # elixir-tests.yml avoids the trap by not using a matrix; the shard
      # job is a matrix by design, so instead ask the Actions API for the
      # latest attempt of every job in this run and require all shard legs
      # present and successful. A missing leg is a failure, not a pass.
      # Partial re-runs: `filter=latest` lists the jobs of the newest attempt.
      # Legs that were not re-run either appear there with their earlier
      # conclusion or are absent; absence fails the count check, so a
      # partial re-run can only pass when every leg is present and green.
      # When in doubt, re-run all jobs rather than a single failed leg.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --paginate \
          "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
          --jq '.jobs[] | select(.name | startswith("test shard (")) | "\(.conclusion)\t\(.name)"' \
          > shard-legs.tsv
        cat shard-legs.tsv
        legs=$(wc -l < shard-legs.tsv | tr -d ' ')
        bad=$(grep -vc '^success' shard-legs.tsv || true)
        if [ "$legs" != "$EXPECTED_SHARD_LEGS" ] || [ "$bad" != "0" ]; then
          echo "expected $EXPECTED_SHARD_LEGS successful shard legs in this attempt, saw $legs with $bad not successful" >&2
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install coverage tooling
      run: python -m pip install "coverage[toml]>=7,<8"

    - name: Download shard coverage data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        # Only the coverage leg's data: the floor keeps its 3.12 meaning and
        # `coverage combine` sees eight distinct files rather than sixteen of
        # which byte-identical pairs would be skipped as duplicates.
        pattern: coverage-data-${{ env.COVERAGE_LEG }}-*
        path: coverage-data
        merge-multiple: true

    - name: Combine coverage and enforce the repository floor
      run: |
        python -m coverage combine coverage-data
        python -m coverage report --show-missing --fail-under=75
        python -m coverage html

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-report-3.12
        path: htmlcov/
        if-no-files-found: warn


  dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        # Full history so the dependency-regression guard can read the base ref.
        fetch-depth: 0

    # A branch opened before a neighbouring dependency PR merged carries a
    # lockfile generated against the older base, so merging it rolls other
    # packages back. `git merge` reports CLEAN for that — the branch never
    # touched those lines relative to its own base — so nothing else catches
    # it. See scripts/dev/check_dependency_regression.py.
    - name: Determine diff base
      id: dep_base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
        fi

    - name: Dependency regression guard
      run: |
        python3 scripts/dev/check_dependency_regression.py \
          --base "${{ steps.dep_base.outputs.ref }}"

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json

    - name: Install dashboard deps
      working-directory: dashboard
      run: npm ci

    # The dashboard is buildless (redesign serves raw HTML/CSS/JS; /phase is a
    # standalone D3 page). The classic dashboard and its vite BUILD were
    # retired, so there is nothing to compile — but the jsdom test suite that
    # replaced it is a real gate and was never wired in. Six spec files added
    # in Aug 2026 ran nowhere, and landing-agent-presence went red on #1707
    # (2026-08-17) without anyone noticing, because the copy it asserts on
    # changed and only lint was enforced. Lint cannot catch a section that
    # renders the wrong value; these tests can.
    - name: Lint
      working-directory: dashboard
      run: npm run lint

    - name: Test
      working-directory: dashboard
      run: npm test

  server-package:
    # Build the non-editable distribution and keep the checkout off sys.path.
    # Setuptools otherwise treats `src/` as a layout root, flattens the literal
    # `src` package, and silently drops the top-level governance_core package.
    #
    # This job existed before 2026-08-19 but only imported `src`, `governance_core`
    # and `src.versioning` — none of which import `config`. So it passed green
    # while the wheel raised ModuleNotFoundError on the 67 modules that do. The
    # import list below is therefore deliberately module-level and config-bound:
    # a package that builds but cannot import its own server is not packaged.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Build and install the server package
      run: |
        python -m pip install --upgrade pip build
        python -m build
        pip install dist/governance_mcp-*.whl -c constraints.txt

    - name: Verify installed package layout and metadata
      run: |
        cd /tmp
        python - <<'PY'
        from importlib.metadata import version
        from importlib.resources import files
        from pathlib import Path
        import governance_core
        import src
        import src.eisv_format as legacy_formatting
        import src.eisv_validator as legacy_validation
        import src.eisv.formatting as canonical_formatting
        import src.eisv.validation as canonical_validation
        from src.versioning import load_version_from_file

        installed_version = version("governance-mcp")
        assert installed_version != "0.0.0"
        assert legacy_formatting is canonical_formatting
        assert legacy_validation is canonical_validation
        assert legacy_formatting.EISVMetrics is canonical_formatting.EISVMetrics
        assert (
            legacy_validation.IncompleteEISVError
            is canonical_validation.IncompleteEISVError
        )
        package_root = Path(src.__file__).resolve().parent.parent
        assert load_version_from_file(package_root) == installed_version
        assert files("src").joinpath("tool_descriptions.json").is_file()
        assert files("src").joinpath("violation_taxonomy.yaml").is_file()
        print("installed server packages and metadata verified")
        PY

    - name: Standalone import smoke (no repo on path)
      run: |
        cd /tmp
        python - <<'PY'
        # Every import here is module-level and reaches `config`, which is the
        # regression this guards. Kept to the CORE dependency set on purpose:
        # src.mcp_server pulls prometheus_client from the `full` extra, so
        # importing it would test the extra rather than the package layout.
        import config.governance_config
        import src.temporal
        import src.confidence
        import src.monitor_result
        import src.mcp_server_std

        from config.governance_config import GovernanceConfig
        assert GovernanceConfig is not None
        print("standalone import OK — config resolves from the installed wheel")
        PY

  sdk-package:
    # Be our own consumer.
    #
    # `pyproject.toml` sets `pythonpath = [".", "agents/sdk/src"]`, so every
    # test and every in-tree resident resolves `unitares_sdk` from its raw
    # SOURCE TREE. The SDK is also not a declared dependency anywhere. That
    # means the packaging — packages.find, package-data, py.typed, the
    # dependency pins — is exercised by nothing on a normal run, while
    # agents/README.md calls the SDK "the public contract" and hands strangers
    # an install command.
    #
    # This job installs it the way an outside consumer would (a real wheel,
    # not editable, not on sys.path) and runs its suite against that install,
    # so a packaging regression fails a PR instead of surfacing the first time
    # someone outside this repo tries to depend on it.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install the SDK as a built package
      # Non-editable on purpose: an editable install would put the source tree
      # back on the path and this job would prove nothing.
      run: |
        python -m pip install --upgrade pip
        pip install ./agents/sdk -c constraints.txt
        pip install pytest pytest-asyncio

    - name: Import it with the repo off the path
      run: |
        cd /tmp
        python -c "
        import unitares_sdk
        from unitares_sdk.agent import GovernanceAgent
        from unitares_sdk.client import GovernanceClient
        from unitares_sdk.lease_plane import PROTOCOL_VERSION
        print('installed-package import OK, lease-plane protocol', PROTOCOL_VERSION)
        "

    - name: Assert the import resolves to site-packages, not the source tree
      # Without this the job could silently start testing agents/sdk/src again
      # — passing while proving nothing, which is the failure mode this repo
      # keeps hitting: instrumentation that fails toward "healthy".
      run: |
        python - <<'PY'
        import pathlib, sys, unitares_sdk
        resolved = pathlib.Path(unitares_sdk.__file__).resolve()
        if "site-packages" not in resolved.parts:
            sys.exit(f"unitares_sdk resolved to {resolved}, not an installed package")
        print(f"resolved to {resolved}")
        PY

    - name: Run the SDK suite against the installed package
      # `-o pythonpath=` overrides the repo pyproject's injection. Tests run in
      # place so their fixture paths still resolve; only the import source moves.
      run: python -m pytest agents/sdk/tests -q -o pythonpath=

  mcp-newest:
    # Blocking support lane: tests the NEWEST in-range mcp resolution,
    # deliberately
    # without constraints.txt. This is where "does the next mcp version work"
    # is answered on purpose — the blocking jobs pin to the production
    # resolution, so a new PyPI release can no longer silently become the
    # tested configuration. Red here means the newest allowed mcp breaks a
    # real client seam (see tests/test_mcp_dependency_canary.py). Because the
    # package admits this resolution, red blocks merges; green is also the
    # precondition for bumping constraints.txt.
    name: mcp-newest (supported)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install newest in-range dependencies (no constraints, on purpose)
      # A fresh unconstrained resolve of requirements-full.txt already picks
      # the newest in-range mcp; a separate `pip install --upgrade mcp` would
      # hardcode a copy of the range and non-eagerly re-resolve on top of it —
      # producing a dep combination no real install has.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-full.txt
        python -c "import importlib.metadata as m; print('resolved mcp', m.version('mcp'))"

    - name: Run the mcp dependency canary under the newest resolution
      # Include the schema contract that first exposed the 2.x
      # inputSchema -> input_schema attribute rename. The production accessor
      # must remain the only read path under either supported major.
      run: >-
