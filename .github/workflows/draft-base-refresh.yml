name: Draft Base Refresh

# Drafts here do not merely wait — they ROT. PR #2184 was authored mergeable,
# sat while its stacked base (#2176) merged, and is now `dirty`; #2187 the same.
# Waiting converted finished work into conflict work, which is a cost the delay
# itself created rather than deferred.
#
# This merges the base branch into any open draft that is BEHIND but still
# CONFLICT-FREE, so a PR that was mergeable stays mergeable. It is deliberately
# the narrowest useful action:
#
#   * Only DRAFT PRs, and only ones whose mergeable state is `behind`. A PR
#     already `dirty` needs a human decision about which side wins; this never
#     touches one.
#   * Only branches in THIS repo (never a fork's head).
#   * A merge commit, never a rebase or force-push, so nobody's checkout breaks
#     and no commit anyone else authored is rewritten.
#   * It never marks a PR ready and never merges it. Readiness belongs to the
#     owning agent and merging to the maintainer (AGENTS.md / CLAUDE.md); a
#     workflow doing either would be the "silent green button" the delivery
#     contract forbids.
#
#   * Only drafts idle longer than QUIET_HOURS. This workflow cannot see
#     whether an agent is mid-session on a branch, so it treats recent activity
#     as evidence that someone may be, and declines to push into it. The signal
#     is the PR's `updatedAt`, the same one `stuck_draft_audit.py` uses for its
#     IN-FLIGHT class, at the same 12h default — the audit calling a draft
#     IN-FLIGHT and this job refreshing it would be two instruments disagreeing
#     about whether anybody is working. `updatedAt` also moves on comments, not
#     just pushes, so it over-skips rather than under-skips; that is the safe
#     direction for a job that writes to someone else's branch.
#
#   * Only a PR whose live state still matches the idleness verdict. The listing
#     snapshots `headRefOid` beside `updatedAt`; immediately before pushing, the
#     job re-reads OPEN/draft status, activity, labels, and the head OID. The push
#     then names that OID in an explicit force-with-lease compare-and-swap, with
#     force-if-includes as the second history-loss guard. An owner push or opt-out
#     inside either race window therefore rejects this refresh instead of losing
#     their work.
#
# Label a PR `no-base-refresh` to opt out — for a PR deliberately pinned to an
# older base, or one stacked on another PR's branch where a base merge would
# pull in the wrong history.
#
# Credentials. Every read uses GITHUB_TOKEN. The PUSH uses the repository
# secret DRAFT_BASE_REFRESH_TOKEN and nothing else. A head pushed with
# GITHUB_TOKEN gets its `pull_request` workflow runs created in the
# approval-required state — GitHub documents it: "when a workflow using
# GITHUB_TOKEN creates or updates a pull request, the resulting pull_request
# event creates workflow runs in an approval-required state" — so every
# required check on the refreshed head waits for a maintainer's click, and
# the draft is LESS mergeable than the stale head it replaced. PR #2250,
# 2026-09-16: eight workflows parked at 19:37Z, `mergeable_state: blocked`,
# approved by hand at 23:06Z. The repository's contributor-approval policy
# does not clear it: github-actions[bot] already had a merged commit on
# master and was gated anyway, because the rule is about the token, not the
# actor. GitHub's own remedy is the one used here: "use a GitHub App
# installation access token or a personal access token instead of
# GITHUB_TOKEN when creating or updating the pull request."
#
# The secret is a fine-grained personal access token, or a GitHub App
# installation token minted in a preceding step, with `Contents: read and
# write` on THIS repository only. That permission can push to this
# repository's unprotected branches and nothing more: it cannot read
# secrets, approve runs, mark a PR ready, or land on master, which branch
# protection guards from admins too. actions/checkout persists it as the
# checkout's git credential, so `git push` is the only place it acts. The
# merge commit stays authored by github-actions[bot]; the push is
# authenticated as the token's owner, which is what lets GitHub run CI on it.
#
#   gh secret set DRAFT_BASE_REFRESH_TOKEN --repo <owner>/<repo>
#
# Without the secret the sweep still lists, merges, and reports, but WITHHOLDS
# every push and fails the run when it withheld one. A green run that
# refreshed nothing would be instrumentation failing toward "healthy" — the
# retired pr-queue-autoupdate.yml did exactly that for weeks behind a PAT
# nobody created (docs/operations/github-workflow-conventions.md §4). If
# report-only is the intent, disable the workflow or label the drafts.
# GITHUB_TOKEN itself carries `contents: read`, so a gate bug cannot push.
#
# After each push the job polls the Tests workflow (CI_WORKFLOW) for a
# `pull_request` run on the new head, up to CI_WAIT_SECONDS. A run parked in
# approval-required, or no run at all, fails the job and stops the sweep from
# pushing further heads. The merge already pushed stays where it is: undoing
# it would be the history rewrite this workflow promises never to do.
#
# No metered APIs (execution-cost policy); a repository-scoped token is not one.
# https://docs.github.com/en/actions/concepts/security/github_token

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4h; conflict-rot latency tolerance is hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be refreshed without pushing"
        type: boolean
        default: false
      quiet_hours:
        description: "Skip drafts touched within this many hours (0 disables)"
        type: string
        default: ""
      pr_number:
        description: "Refresh only this PR number; empty sweeps every eligible draft"
        type: string
        default: ""

permissions:
  contents: read         # reads only; the push credential is the secret above
  pull-requests: read
  actions: read          # confirm the pushed head's CI run exists

concurrency:
  # Scheduled and manual runs must not race each other into the same branch.
  group: draft-base-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Persisted into the checkout's git config, so the push below is
          # authenticated as the token's owner (header). The fallback only
          # serves a read-only sweep: the script never pushes without the secret.
          token: ${{ secrets.DRAFT_BASE_REFRESH_TOKEN || github.token }}

      - name: Merge base into behind-but-clean drafts
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Kept equal to stuck_draft_audit.py's --quiet-hours default on purpose.
          QUIET_HOURS: ${{ inputs.quiet_hours || '12' }}
          # A GitHub expression, so the script learns whether the secret exists
          # without ever holding its value.
          PUSH_TOKEN_CONFIGURED: ${{ secrets.DRAFT_BASE_REFRESH_TOKEN != '' }}
          # The workflow whose pull_request run proves a pushed head can be
          # checked at all; its `test (3.12)` job is the branch-protection context.
          CI_WORKFLOW: tests.yml
          CI_WAIT_SECONDS: '180'
        run: |
          set -euo pipefail

          # Validate once, before anything can be pushed. An unconstrained value
          # fails OPEN: `[ "$idle_h" -lt abc ]` prints "integer expression
          # expected" and returns non-zero, which as an `if` condition reads as
          # "not inside the quiet period" and lets the mutation through. `set -e`
          # does not catch it, because a condition is allowed to fail.
          case "$QUIET_HOURS" in
            ''|*[!0-9]*)
              echo "::error::QUIET_HOURS must be a nonnegative integer of hours (got '$QUIET_HOURS'); 0 disables the hold."
              exit 1 ;;
          esac
          # All-digit is not the same as in-range: a value past the shell's
          # integer width passes the pattern above and then makes `test -gt`
          # report "integer expression expected", which reads as false and
          # disables the hold — the same fail-open, one step later. The length
          # test runs first and short-circuits, so the numeric compare below it
          # can never see an out-of-range value. 8760h is one year; a quiet
          # period longer than that is a typo, not an intent.
          if [ "${#QUIET_HOURS}" -gt 5 ] || [ "$QUIET_HOURS" -gt 8760 ]; then
            echo "::error::QUIET_HOURS must be at most 8760 (one year); got '$QUIET_HOURS'."
            exit 1
          fi
          # Empty sweeps everything; anything else must be a bare PR number.
          case "$PR_NUMBER" in
            *[!0-9]*) echo "::error::pr_number must be a PR number or empty (got '$PR_NUMBER')."; exit 1 ;;
          esac
          case "$CI_WAIT_SECONDS" in
            ''|*[!0-9]*) echo "::error::CI_WAIT_SECONDS must be a nonnegative integer (got '$CI_WAIT_SECONDS')."; exit 1 ;;
          esac
          if [ "${#CI_WAIT_SECONDS}" -gt 4 ]; then
            echo "::error::CI_WAIT_SECONDS must be under 10000 (got '$CI_WAIT_SECONDS')."
            exit 1
          fi

          # What this run may do to a branch. `push` is the only mode that
          # writes; the other two go through the same listing, fetch, and merge
          # so their report is the one a push would have acted on.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            mode=dry-run
          elif [ "$PUSH_TOKEN_CONFIGURED" = "true" ]; then
            mode=push
          else
            mode=no-token
            echo "::warning::DRAFT_BASE_REFRESH_TOKEN is not configured: this sweep reports and withholds every push. A GITHUB_TOKEN push strands the head in approval-required CI (workflow header)."
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The CI workflow triggers on pull_request only for PRs into the
          # default branch, so a refreshed head elsewhere legitimately has no
          # run to find. Unknown stays empty, which verifies every base: a
          # false red beats a skipped check.
          default_branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef \
            --jq '.defaultBranchRef.name // ""' 2>/dev/null || echo "")

          # State of CI_WORKFLOW's pull_request run on a head, polled up to
          # CI_WAIT_SECONDS: a live status (queued, in_progress, ...),
          # completed:<conclusion>, action_required (parked awaiting approval),
          # absent (no run), or unreadable (the API could not be read). The last
          # three are not evidence that the head can be checked.
          ci_state_for() {
            local sha="$1" state deadline
            deadline=$(( $(date -u +%s) + CI_WAIT_SECONDS ))
            while :; do
              if ! state=$(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?event=pull_request&head_sha=$sha&per_page=20" \
                  --jq '[.workflow_runs[]
                         | if .conclusion == "action_required" then "action_required"
                           elif .status == "completed" then "completed:\(.conclusion)"
                           else .status end]
                        | first // "absent"' 2>/dev/null); then
                state=unreadable
              fi
              case "$state" in
                absent|unreadable) ;;
                *) printf '%s\n' "$state"; return ;;
              esac
              if [ "$(date -u +%s)" -ge "$deadline" ]; then
                printf '%s\n' "$state"; return
              fi
              sleep 10
            done
          }

          # mergeable/mergeStateStatus are computed lazily by GitHub; a fresh
          # query can return UNKNOWN. Ask once, and treat UNKNOWN as "skip" —
          # acting on an unknown merge state is how a clean branch gets a
          # conflicted merge commit pushed into it.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,isDraft,headRefName,headRepositoryOwner,baseRefName,mergeStateStatus,labels,updatedAt,headRefOid \
            > prs.json

          refreshed=0; withheld=0; skipped=0; held=0; ci_failed=0
          now_s=$(date -u +%s)
          while read -r pr; do
            num=$(jq -r .number <<<"$pr")
            head=$(jq -r .headRefName <<<"$pr")
            base=$(jq -r .baseRefName <<<"$pr")
            state=$(jq -r .mergeStateStatus <<<"$pr")
            owner=$(jq -r '.headRepositoryOwner.login // ""' <<<"$pr")
            updated=$(jq -r .updatedAt <<<"$pr")
            oid=$(jq -r '.headRefOid // ""' <<<"$pr")

            echo "::group::PR #$num ($head <- $base, state=$state)"

            if [ "$owner" != "${GITHUB_REPOSITORY%%/*}" ]; then
              echo "skip: head is a fork ($owner)"; skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            # An unreadable timestamp is not evidence of idleness. Hold.
            # The empty check is first and deliberate: `date -d ""` resolves to
            # NOW rather than failing, so an absent updatedAt would otherwise be
            # held as "touched 0h ago" — the right action reported as the wrong
            # finding, which is the confusion this whole branch is about.
            if [ -z "$updated" ] || [ "$updated" = "null" ] \
               || ! updated_s=$(date -u -d "$updated" +%s 2>/dev/null) || [ -z "$updated_s" ]; then
              echo "hold: updatedAt ($updated) could not be read, so idleness is unknown"
              held=$((held+1)); echo "::endgroup::"; continue
            fi
            idle_h=$(( (now_s - updated_s) / 3600 ))
            if [ "$QUIET_HOURS" -gt 0 ] && [ "$idle_h" -lt "$QUIET_HOURS" ]; then
              echo "hold: touched ${idle_h}h ago (< ${QUIET_HOURS}h) — its owner may still be working"
              held=$((held+1)); echo "::endgroup::"; continue
            fi
            if [ "$state" != "BEHIND" ]; then
              echo "skip: not BEHIND (a DIRTY pr needs a human; anything else needs nothing)"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            if [ -z "$oid" ] || [ "$oid" = "null" ]; then
              echo "hold: headRefOid missing, so the idleness verdict cannot be pinned to a commit"
              held=$((held+1)); echo "::endgroup::"; continue
            fi

            # A head this sweep already pushed could not be checked. Whatever
            # broke — the credential, the API, GitHub — would break the next
            # push the same way, and one stranded head is enough to diagnose.
            if [ "$ci_failed" = 1 ]; then
              echo "hold: an earlier push in this sweep did not establish CI; no further heads are pushed"
              held=$((held+1)); echo "::endgroup::"; continue
            fi

            # One unfetchable ref must not abort the sweep for every later PR.
            if ! git fetch origin "$head" "$base" --quiet; then
              echo "skip: could not fetch $head or $base"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            # The idleness verdict above describes $oid. If the branch moved
            # since the listing, that verdict is about a commit that is no
            # longer the head — and an owner push inside that window is exactly
            # what the quiet period is for. Re-read it on the next run.
            fetched=$(git rev-parse --verify --quiet "origin/$head^{commit}" || echo "")
            if [ "$fetched" != "$oid" ]; then
              echo "hold: $head moved since the listing (${oid:0:7} -> ${fetched:0:7}); the idleness verdict is stale"
              held=$((held+1)); echo "::endgroup::"; continue
            fi

            git checkout -q -B "refresh/$num" "$oid"

            msg="Merge $base into $head"
            msg="$msg"$'\n\n'"Keeps this draft mergeable while it waits for review."
            msg="$msg"$'\n'"Opened by the Draft Base Refresh workflow; no readiness"
            msg="$msg"$'\n'"or merge decision is implied."
            if ! git merge --no-edit "origin/$base" -m "$msg"; then
              # A branch GitHub called BEHIND can still conflict if it moved
              # between the query and the fetch. Abandon rather than guess.
              git merge --abort || true
              echo "skip: merge conflicted after all — left for its owner"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            # The original listing is now stale by construction: fetch and merge
            # both took time. Re-read every mutable condition that authorizes a
            # write. Missing or malformed data is not evidence that the PR is
            # still an idle, open draft.
            if ! live=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
                --json state,isDraft,updatedAt,labels,headRefOid 2>/dev/null); then
              echo "hold: live PR state could not be read before push"
              held=$((held+1)); echo "::endgroup::"; continue
            fi
            if ! jq -e '
                (type == "object")
                and ((.state | type) == "string")
                and ((.isDraft | type) == "boolean")
                and ((.updatedAt | type) == "string")
                and ((.labels | type) == "array")
                and ((.headRefOid | type) == "string")
                and (all(.labels[]; (.name | type) == "string"))
              ' >/dev/null <<<"$live"; then
              echo "hold: live PR state was incomplete before push"
              held=$((held+1)); echo "::endgroup::"; continue
            fi
            live_state=$(jq -r .state <<<"$live")
            live_draft=$(jq -r .isDraft <<<"$live")
            live_updated=$(jq -r .updatedAt <<<"$live")
            live_oid=$(jq -r .headRefOid <<<"$live")

            if [ "$live_state" != "OPEN" ] || [ "$live_draft" != "true" ]; then
              echo "skip: PR is no longer an open draft"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi
            if jq -e '[.labels[].name] | index("no-base-refresh") != null' \
                >/dev/null <<<"$live"; then
              echo "skip: no-base-refresh was added after the listing"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi
            if [ "$live_updated" != "$updated" ]; then
              echo "hold: PR activity changed after the idleness verdict"
              held=$((held+1)); echo "::endgroup::"; continue
            fi
            if [ "$live_oid" != "$oid" ]; then
              echo "hold: $head moved before push (${oid:0:7} -> ${live_oid:0:7})"
              held=$((held+1)); echo "::endgroup::"; continue
            fi

            case "$mode" in
              dry-run)
                echo "dry-run: would push $(git rev-parse --short HEAD) to $head"
                refreshed=$((refreshed+1))
                ;;
              no-token)
                echo "withheld: would push $(git rev-parse --short HEAD) to $head, but DRAFT_BASE_REFRESH_TOKEN is not configured and a GITHUB_TOKEN push would strand the head in approval-required CI"
                withheld=$((withheld+1))
                ;;
              push)
                # Exact expected-OID CAS closes the final race after the live read.
                # force-if-includes is mandatory alongside the explicit lease so a
                # history rewrite can never discard a commit absent from this merge.
                if ! git push \
                    --force-with-lease="refs/heads/$head:$oid" \
                    --force-if-includes \
                    origin "HEAD:refs/heads/$head"; then
                  echo "hold: push lease rejected; $head moved or could not be updated"
                  held=$((held+1)); echo "::endgroup::"; continue
                fi
                refreshed=$((refreshed+1))
                new_oid=$(git rev-parse HEAD)
                echo "refreshed: pushed merge of $base into $head (${new_oid:0:7})"

                # The push is not the outcome; a head that can be checked is.
                if [ -n "$default_branch" ] && [ "$base" != "$default_branch" ]; then
                  echo "unverified: $CI_WORKFLOW runs on pull_request only for PRs into $default_branch, so no run is expected on this head"
                else
                  ci=$(ci_state_for "$new_oid")
                  case "$ci" in
                    queued|in_progress|waiting|requested|pending|completed:success)
                      echo "::notice::PR #$num: refreshed to ${new_oid:0:7}; its $CI_WORKFLOW run is $ci."
                      ;;
                    completed:*)
                      echo "::notice::PR #$num: refreshed to ${new_oid:0:7}; its $CI_WORKFLOW run already finished ($ci) — read the head's checks before trusting it."
                      ;;
                    action_required)
                      echo "::error::PR #$num: the refreshed head ${new_oid:0:7} is parked in approval-required CI. The push credential does not establish CI (workflow header); approve the head's runs by hand. No further heads are pushed in this sweep."
                      ci_failed=1
                      ;;
                    *)
                      echo "::error::PR #$num: no $CI_WORKFLOW pull_request run could be confirmed on the refreshed head ${new_oid:0:7} within ${CI_WAIT_SECONDS}s ($ci). Check the head by hand. No further heads are pushed in this sweep."
                      ci_failed=1
                      ;;
                  esac
                fi
                ;;
            esac
            echo "::endgroup::"
          done < <(jq -c --arg only "$PR_NUMBER" '
                     .[] | select(.isDraft)
                         | select([.labels[].name] | index("no-base-refresh") | not)
                         | select($only == "" or (.number | tostring) == $only)' prs.json)

          {
            echo "## Draft base refresh ($mode)"
            case "$mode" in
              dry-run)  echo "- would refresh: $refreshed" ;;
              no-token) echo "- withheld (DRAFT_BASE_REFRESH_TOKEN not configured): $withheld" ;;
              push)     echo "- refreshed: $refreshed" ;;
            esac
            echo "- skipped:   $skipped"
            echo "- held (active within ${QUIET_HOURS}h, idleness unreadable, or after a CI failure): $held"
            echo
            echo "Readiness and merge are untouched by this job by design."
            if [ "$ci_failed" = 1 ]; then
              echo "**A refreshed head did not get a $CI_WORKFLOW run; see the annotations.**"
            elif [ "$mode" = "push" ] && [ "$refreshed" -gt 0 ]; then
              echo "Each refreshed head has a $CI_WORKFLOW pull_request run, or the notice above says why not."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ci_failed" = 1 ]; then
            echo "::error::A refreshed head could not be checked; the sweep stopped pushing. See the annotations above."
            exit 1
          fi
          if [ "$withheld" -gt 0 ]; then
            echo "::error::$withheld draft(s) are behind and idle but were not refreshed: DRAFT_BASE_REFRESH_TOKEN is not configured, and a GITHUB_TOKEN push would strand each head in approval-required CI (PR #2250, 2026-09-16). Provision the secret (workflow header), label the drafts no-base-refresh, or disable this workflow."
            exit 1
          fi
