[build-system]
# >=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-mcp"
version = "2.18.0"
description = "UNITARES runtime telemetry and policy-feedback MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kenny Wang" }]
keywords = ["ai-agents", "governance", "mcp", "multi-agent-systems", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0,<3.0.0",
    # httpx is imported directly on the server startup path (wave3a_beam_proxy,
    # the stdio server, the dialectic BEAM clients). It used to arrive
    # transitively via mcp 1.x; mcp 2.x depends on `httpx2` instead, so it must
    # be declared explicitly now.
    "httpx>=0.27.0,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    # governance_core (EISV ODE engine) lives in this repo at top-level
    # governance_core/ — pure Python, no separate install needed. The package
    # was previously a separate private compiled wheel (CIRWEL/unitares-core);
    # folded back in 2026-04-24 once IP-protection rationale dissolved.
    # The unitares-core repo remains as an archived historical reference at v2.3.0.
]

[project.optional-dependencies]
full = [
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.37.0,<2.0.0",
    "websockets>=12.0,<18.0",
    "psutil>=5.9.0,<8.0.0",
    "aiofiles>=23.2.1,<26.0.0",
    "orjson>=3.9.0,<4.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "redis>=5.0.0,<9.0.0",
    "sentence-transformers>=2.2.0,<6.0.0",
    "requests>=2.31.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Ed25519 signing/verification for the Agent Identity Credential (AIC)
    # attestation primitive (src/identity/agent_identity_credential.py). The
    # module guards the import, so the core install does not require it.
    "cryptography>=41.0.0,<51.0.0",
    # Passkey ceremonies for the browser dashboard. Imported lazily so the
    # core (non-HTTP) install remains minimal.
    "webauthn>=2.8.0,<4.0.0",
]
dev = [
    "pytest>=7.4.0,<10.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "Markdown>=3.6.0,<4.0.0",
]
analysis = [
    "scipy>=1.10.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "editdistance>=0.6.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/cirwel/unitares"
Documentation = "https://github.com/cirwel/unitares/blob/master/docs/README.md"
Source = "https://github.com/cirwel/unitares"
Issues = "https://github.com/cirwel/unitares/issues"
Changelog = "https://github.com/cirwel/unitares/blob/master/docs/CHANGELOG.md"

# The repository intentionally has a Python package literally named `src`.
# Implicit src-layout discovery flattens that package and omits governance_core,
# producing a wheel that cannot satisfy the imports used by the checkout.
#
# `config` is in this list for the same reason and was missed until 2026-08-19:
# 67 module-level `from config.governance_config import ...` statements in src/
# meant the built wheel raised ModuleNotFoundError on first import. Nothing
# caught it because nothing consumes the wheel — the Dockerfile copies the
# source trees and runs from /app, and `pip install -e .` puts the repo root on
# sys.path, so `config` resolves in every path the project actually uses. The
# wheel-standalone-import job in tests.yml now builds and imports it so this
# cannot regress silently again.
#
# NOT YET PUBLISHABLE. This distribution claims the top-level import names
# `src` and `config`, which are far too generic to own on PyPI — installing it
# alongside any other package using either name would break both. Publishing
# requires re-homing these under a single `unitares/` namespace first. Until
# then the install contract is the Docker Compose flow in README.md, and this
# metadata exists so the tree is a coherent, testable package.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "governance_core", "governance_core.*", "config", "config.*"]

[tool.setuptools.package-data]
src = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "agents"]
pythonpath = [".", "agents/sdk/src"]
addopts = ["-v"]
# Coverage is opt-in: `make test`, `scripts/dev/test-cache.sh`, and CI pass
# `--cov=...` / `--cov-fail-under=75` explicitly. Enabling it in addopts caused
# `pytest --collect-only` to measure ~14% and fail the gate (no tests run).
# HTML: add `--cov-report=html` to a full run when needed (22MB+ per run).
markers = [
    "smoke: Fast smoke tests for pre-push validation (target <60s)",
    "integration: Full-stack tests that drive a running governance stack (opt-in; gated on RUN_INTEGRATION_STACK=1, skip cleanly when no stack is up)",
    "chaos: Deterministic failure-injection tests asserting documented degradation contracts (no live services; selectable with -m chaos)",
]
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore:unclosed database:ResourceWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
    # Unawaited-coroutine leak enforcement lives in tests/conftest.py via
    # pytest_warning_recorded + pytest_sessionfinish. filterwarnings cannot
    # catch these because pytest wraps every test in catch_warnings(record=True),
    # which stores warnings in a log and bypasses "error:" promotion.
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/archive/*",
    "*/demos/*",
    "*/scripts/*",
    "setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Dead-code gate: unused imports only, kept at zero by CI.
# F841/F811/ERA cleanups are tracked separately — widen this list as they reach zero.
select = ["F401"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-export surfaces
"**/__init__.py" = ["F401"]
# Pytest imports fixtures/plugins that ruff cannot see as used
"tests/**" = ["F401"]
"agents/*/tests/**" = ["F401"]
"agents/sdk/tests/**" = ["F401"]
# Declared re-export facades (docstring-marked); consumers import moved names through them
"src/agent_state.py" = ["F401"]
"src/mcp_handlers/utils.py" = ["F401"]
"src/mcp_handlers/cirs/protocol.py" = ["F401"]
"src/mcp_handlers/lifecycle/handlers.py" = ["F401"]
"src/http_api.py" = ["F401"]
"src/mcp_handlers/identity/core.py" = ["F401"]
"src/mcp_handlers/identity/handlers.py" = ["F401"]
# Re-export hub for watcher tests/hooks (tests monkeypatch.setattr these names on the agent module)
"agents/watcher/agent.py" = ["F401"]
