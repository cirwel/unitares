[build-system]
# >=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitares-sdk"
version = "0.3.0"
description = "Agent SDK for UNITARES governance — check-in loop, EISV state, identity anchors, and lease-plane client for long-lived AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "cirwel" }]
keywords = ["ai-agents", "governance", "mcp", "multi-agent-systems", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
    # The client library for mcp 1.x. On mcp 2.x the transport is written
    # against `httpx2`, which arrives as an mcp dependency — the SDK never
    # imports either directly, it asks `_mcp_httpx.mcp_httpx()` which one the
    # installed transport expects. Keep this declared so a 1.x install does
    # not rely on mcp's transitive graph for it.
    "httpx>=0.27.0,<1.0.0",
    # Widened past 2.0 by the httpx2 injection port. Also required so a
    # constrained `pip install` of this package does not hard-error when
    # constraints.txt pins mcp to a 2.x resolution.
    "mcp>=1.26.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/cirwel/unitares"
Documentation = "https://github.com/cirwel/unitares/blob/master/agents/sdk/README.md"
Source = "https://github.com/cirwel/unitares"
Issues = "https://github.com/cirwel/unitares/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitares_sdk = ["py.typed"]
